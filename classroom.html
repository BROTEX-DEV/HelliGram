<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>کلاس آنلاین | حلی‌گرام</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101d;color:#eef4ff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#1b304b;color:#eef4ff;font-weight:700}button.primary{background:#2f91ff}button.danger{background:#b52d49}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1440px;margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#0f1d30;border:1px solid #213b5a;border-radius:18px;padding:15px 18px;margin-bottom:14px}.brand{font-weight:800;font-size:18px}.muted{color:#91a5bf;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.panel{background:#0f1d30;border:1px solid #213b5a;border-radius:18px;overflow:hidden}.panelTitle{padding:14px 16px;border-bottom:1px solid #213b5a;font-weight:800}.stage{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-content:start;min-height:380px}.tile{position:relative;background:#030812;border-radius:15px;overflow:hidden;min-height:190px;aspect-ratio:16/10;border:1px solid #263b56}.tile video{width:100%;height:100%;min-height:190px;object-fit:cover;display:block}.tile .name{position:absolute;bottom:9px;right:9px;background:#07101dd9;border:1px solid #40516a;border-radius:9px;padding:6px 9px;font-size:12px}.tile .state{position:absolute;top:9px;left:9px;background:#07101dd9;border-radius:9px;padding:5px 7px;font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-top:1px solid #213b5a}.controls button{flex:1;min-width:110px}.chat{display:flex;flex-direction:column;min-height:460px;height:min(72vh,760px)}.chatBody{padding:12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:9px}.bubble{background:#192c44;border:1px solid #284361;border-radius:13px;padding:9px 11px;max-width:95%;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#173b61}.bubble small{display:block;color:#9eb4ce;font-size:10px;margin-bottom:5px}.chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid #213b5a}.chatForm input{min-width:0;flex:1;border-radius:12px;padding:11px;border:1px solid #2b4564;background:#07101d;color:white}.participants{padding:12px;border-top:1px solid #213b5a;display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:11px;border:1px solid #2b4564;background:#13243a;border-radius:20px;padding:6px 9px}.notice{background:#142841;border:1px solid #284361;border-radius:14px;padding:12px;line-height:1.8;margin:12px 0}.error{color:#ff9daa}.hidden{display:none!important}.status{font-size:12px;color:#9cb2cc;padding:0 14px 10px;line-height:1.7}.footer{text-align:center;color:#526985;font-size:10px;padding:18px}@media(max-width:850px){.layout{grid-template-columns:1fr}.chat{height:430px;min-height:350px}.stage{min-height:250px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.tile,.tile video{min-height:150px}.shell{padding:9px}.top{padding:13px}.brand{font-size:16px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="brand">🎓 کلاس آنلاین حلی‌گرام</div><div class="muted" id="roomSubtitle">در حال بررسی لینک جلسه...</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" onclick="copyRoomLink()">کپی لینک</button><button type="button" onclick="location.href='index.html'">بازگشت به حلی‌گرام</button></div></header>
<div id="notice" class="notice">در حال اتصال به سامانه...</div>
<div id="roomUI" class="layout hidden">
<section class="panel"><div class="panelTitle"><span id="roomTitle">کلاس آنلاین</span><span id="roomStatus" class="muted" style="float:left">در حال آماده سازی</span></div>
<div id="stage" class="stage"><div class="notice">برای فعال کردن صدا و تصویر، روی «ورود به کلاس» بزنید.</div></div>
<div class="controls"><button id="joinBtn" class="primary" type="button" onclick="joinRoom()">🎙️ ورود به کلاس</button><button id="micBtn" type="button" disabled onclick="toggleMic()">🎤 میکروفون</button><button id="camBtn" type="button" disabled onclick="toggleCam()">📹 دوربین</button><button id="leaveBtn" class="danger" type="button" disabled onclick="leaveRoom()">خروج از کلاس</button></div>
<div id="roomFeedback" class="status"></div><div class="participants" id="participants"></div></section>
<section class="panel chat"><div class="panelTitle">💬 گفت و گوی کلاس</div><div id="chatBody" class="chatBody"><div class="muted">پس از ورود به جلسه، پیام ها نمایش داده می شوند.</div></div><form class="chatForm" onsubmit="sendChat(event)"><input id="chatInput" maxlength="2000" placeholder="پیام خود را بنویسید..." autocomplete="off" disabled><button class="primary" id="chatSend" disabled>ارسال</button></form></section>
</div>
<div class="footer">HelliGram · کلاس آنلاین · v0.5.65</div>
</div>
<script>
const SUPABASE_URL="https://pwwicgyrycaexjnnhseb.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3d2ljZ3lyeWNhZXhqbm5oc2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzczMjgsImV4cCI6MjEwNjYxMzMyOH0.860RskDmycONZUHyOloN8AmKqRkzU5YNXUUze2DuPdM";
const API=SUPABASE_URL+"/functions/v1/helligram-api";
const roomId=new URLSearchParams(location.search).get("room")||"";
let token=localStorage.getItem("helligram_token")||"",profile=null,meeting=null,joined=false,localStream=null,pollTimer=null,chatTimer=null,pollBusy=false,chatBusy=false,micOn=true,camOn=true;
const pcs=new Map(),seenIce=new Set(),pendingIce=new Map(),remoteStreams=new Map();
const $=id=>document.getElementById(id);
async function api(action,body={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,...(token?{"x-helligram-token":token}:{})},body:JSON.stringify({action,...body})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"ارتباط با سرور ناموفق بود.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setNotice(t,error=false){$("notice").textContent=t;$("notice").classList.toggle("error",error);$("notice").classList.toggle("hidden",!t)}
function roomLink(){return location.href}
async function copyRoomLink(){try{await navigator.clipboard.writeText(roomLink());$("roomFeedback").textContent="لینک جلسه کپی شد."}catch{prompt("لینک جلسه را کپی کنید:",roomLink())}}
async function init(){if(!roomId){setNotice("لینک جلسه ناقص است.",true);return}if(!token){setNotice("برای ورود ابتدا وارد حساب حلی‌گرام شوید. پس از ورود، لینک جلسه را دوباره باز کنید.");const b=document.createElement("button");b.className="primary";b.textContent="ورود به حلی‌گرام";b.onclick=()=>location.href="index.html?room="+encodeURIComponent(roomId);$("notice").appendChild(document.createElement("br"));$("notice").appendChild(b);return}try{const me=await api("me");profile=me.profile;const d=await api("meeting_info",{meeting_id:roomId});meeting=d.meeting;$("roomTitle").textContent=meeting.title;$("roomSubtitle").textContent=meeting.description||"جلسه آنلاین با لینک اختصاصی";if(meeting.status!=="active"){setNotice("این جلسه توسط مسئول پایان یافته است.",true);return}$("roomUI").classList.remove("hidden");setNotice("");}catch(e){setNotice(e.message,true)}}
async function joinRoom(){if(joined)return;$("joinBtn").disabled=true;$("roomFeedback").textContent="در حال ورود به جلسه...";try{await api("meeting_join",{meeting_id:roomId});joined=true;$("leaveBtn").disabled=false;$("chatInput").disabled=false;$("chatSend").disabled=false;$("joinBtn").textContent="وارد کلاس شدید";$("micBtn").disabled=false;$("camBtn").disabled=false;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:{width:{ideal:640},height:{ideal:360},facingMode:"user"}});micOn=true;camOn=true;addLocalTile()}catch(e){$("roomFeedback").textContent="به میکروفون یا دوربین دسترسی داده نشد؛ می توانید از چت استفاده کنید. "+e.message;$("micBtn").disabled=true;$("camBtn").disabled=true}await pollRoom();await loadChat();pollTimer=setInterval(pollRoom,1800);chatTimer=setInterval(loadChat,2500);$("roomFeedback").textContent="وارد کلاس شدید. برای استفاده از صدا و تصویر، مجوز مرورگر را تایید کنید."}catch(e){joined=false;$("joinBtn").disabled=false;$("roomFeedback").textContent=e.message}}
function addLocalTile(){let old=$("tile-local");if(old)old.remove();const tile=document.createElement("div");tile.className="tile";tile.id="tile-local";tile.innerHTML='<video autoplay playsinline muted></video><span class="name">'+esc(profile?.name||"شما")+' (شما)</span><span class="state" id="localState">زنده</span>';$("stage").appendChild(tile);tile.querySelector("video").srcObject=localStream}
function peerKey(p){return p.a_type+":"+p.a_id===profile.type+":"+profile.id?p.b_type+":"+p.b_id:p.a_type+":"+p.a_id}
function isMineA(p){return p.a_type===profile.type&&p.a_id===profile.id}
function otherIdentity(p){return isMineA(p)?p.b_type+":"+p.b_id:p.a_type+":"+p.a_id}
function ensureRemoteTile(key,name){let id="tile-"+key.replace(/[^a-zA-Z0-9_-]/g,"_");let tile=document.getElementById(id);if(!tile){tile=document.createElement("div");tile.className="tile";tile.id=id;tile.innerHTML='<video autoplay playsinline></video><span class="name">'+esc(name)+'</span><span class="state">در حال اتصال</span>';$("stage").appendChild(tile)}else tile.querySelector(".name").textContent=name;return tile}
function rtcFor(p,name){let state=pcs.get(p.id);if(state)return state;const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},{urls:"turns:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}]});state={pc,remoteSet:false,pending:[]};pcs.set(p.id,state);if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)api("meeting_ice",{peer_id:p.id,candidate:e.candidate.toJSON()}).catch(()=>{})};pc.ontrack=e=>{const tile=ensureRemoteTile(otherIdentity(p),name);tile.querySelector("video").srcObject=e.streams[0];tile.querySelector(".state").textContent="متصل";tile.querySelector("video").play().catch(()=>{})};pc.onconnectionstatechange=()=>{const tile=document.getElementById("tile-"+otherIdentity(p).replace(/[^a-zA-Z0-9_-]/g,"_"));if(tile)tile.querySelector(".state").textContent=pc.connectionState==="connected"?"متصل":pc.connectionState==="failed"?"اتصال ناموفق":pc.connectionState==="disconnected"?"قطع موقت":"در حال اتصال"};return state}
async function addRemoteIce(state,candidate){try{if(state.remoteSet&&state.pc.remoteDescription)await state.pc.addIceCandidate(candidate);else state.pending.push(candidate)}catch(e){console.warn("ICE candidate",e)}}
async function flushIce(state){for(const c of state.pending.splice(0)){try{await state.pc.addIceCandidate(c)}catch{}}}
async function handlePeer(p,name){if(p.status==="closed")return;const state=rtcFor(p,name),pc=state.pc;try{if(isMineA(p)){if(p.answer&&!state.remoteSet){await pc.setRemoteDescription(new RTCSessionDescription(p.answer));state.remoteSet=true;await flushIce(state)}else if(!p.offer&&p.status==="new"&&!state.makingOffer){state.makingOffer=true;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await api("meeting_peer_update",{peer_id:p.id,offer:pc.localDescription});state.makingOffer=false}}else if(p.offer&&!state.remoteSet){await pc.setRemoteDescription(new RTCSessionDescription(p.offer));state.remoteSet=true;await flushIce(state);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await api("meeting_peer_update",{peer_id:p.id,answer:pc.localDescription})}}catch(e){$("roomFeedback").textContent="خطا در اتصال به یکی از شرکت کنندگان: "+e.message}}
async function pollRoom(){if(!joined||pollBusy)return;pollBusy=true;try{const d=await api("meeting_poll",{meeting_id:roomId});if(d.meeting?.status!=="active"){setNotice("مسئول جلسه را پایان داده است.",true);await leaveRoom(false);return}const participants=d.participants||[];$("participants").innerHTML=participants.map(p=>'<span class="pill">'+esc(p.name)+(p.self?" · شما":"")+'</span>').join("");$("roomStatus").textContent=participants.length+" نفر حاضر";const nameMap=new Map(participants.map(p=>[p.type+":"+p.id,p.name]));const activePeers=(d.peers||[]).filter(p=>(p.a_type===profile.type&&p.a_id===profile.id)||(p.b_type===profile.type&&p.b_id===profile.id));for(const p of activePeers)await handlePeer(p,nameMap.get(otherIdentity(p))||"شرکت کننده");for(const c of (d.ice||[])){if(seenIce.has(c.id))continue;seenIce.add(c.id);const st=pcs.get(c.peer_id);if(st)await addRemoteIce(st,c.candidate)}for(const [id,st] of pcs){if(!activePeers.some(p=>p.id===id)){st.pc.close();pcs.delete(id)}}}catch(e){$("roomFeedback").textContent=e.message}finally{pollBusy=false}}
async function loadChat(){if(!joined||chatBusy)return;chatBusy=true;try{const d=await api("meeting_chat_list",{meeting_id:roomId});const el=$("chatBody"),near=el.scrollHeight-el.scrollTop-el.clientHeight<90;el.innerHTML=(d.messages||[]).map(m=>'<div class="bubble '+(m.sender_type===profile.type&&m.sender_id===profile.id?"mine":"")+'"><small>'+esc(m.sender_name)+' · '+esc(new Date(m.created_at).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}))+'</small>'+esc(m.content)+'</div>').join("")||'<div class="muted">هنوز پیامی در کلاس نیست.</div>';if(near)el.scrollTop=el.scrollHeight}catch(e){$("roomFeedback").textContent=e.message}finally{chatBusy=false}}
async function sendChat(e){e.preventDefault();const input=$("chatInput"),content=input.value.trim();if(!content||!joined)return;input.value="";try{await api("meeting_chat_send",{meeting_id:roomId,content});await loadChat()}catch(err){input.value=content;$("roomFeedback").textContent=err.message}}
function toggleMic(){if(!localStream)return;micOn=!micOn;localStream.getAudioTracks().forEach(t=>t.enabled=micOn);$("micBtn").textContent=micOn?"🎤 میکروفون روشن":"🔇 میکروفون خاموش";$("micBtn").style.background=micOn?"#1b304b":"#b52d49";const st=$("localState");if(st)st.textContent=micOn?"میکروفون روشن":"میکروفون خاموش"}
function toggleCam(){if(!localStream)return;camOn=!camOn;localStream.getVideoTracks().forEach(t=>t.enabled=camOn);$("camBtn").textContent=camOn?"📹 دوربین روشن":"🚫 دوربین خاموش";$("camBtn").style.background=camOn?"#1b304b":"#b52d49";const video=$("tile-local")?.querySelector("video");if(video)video.style.opacity=camOn?"1":".2"}
async function leaveRoom(send=true){if(!joined&&!localStream)return;joined=false;clearInterval(pollTimer);clearInterval(chatTimer);pollTimer=chatTimer=null;for(const st of pcs.values())st.pc.close();pcs.clear();if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}if(send)try{await api("meeting_leave",{meeting_id:roomId})}catch{}$("joinBtn").disabled=false;$("joinBtn").textContent="ورود دوباره به کلاس";$("micBtn").disabled=true;$("camBtn").disabled=true;$("leaveBtn").disabled=true;$("chatInput").disabled=true;$("chatSend").disabled=true;$("roomStatus").textContent="خارج از کلاس";$("roomFeedback").textContent="از جلسه خارج شدید."}
window.addEventListener("beforeunload",()=>{if(joined){try{fetch(API,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"x-helligram-token":token},body:JSON.stringify({action:"meeting_leave",meeting_id:roomId})})}catch{}}});
init();
</script>
</body>
</html>
