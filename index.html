:root{color-scheme:dark;--bg:#070916;--panel:rgba(17,22,47,.78);--line:rgba(126,147,255,.20);--cyan:#54e7ff;--violet:#a879ff;--blue:#6688ff;--muted:#a2abc9}

body{background:radial-gradient(ellipse at 8% 5%,rgba(74,75,255,.20),transparent 34%),radial-gradient(ellipse at 92% 18%,rgba(0,220,255,.13),transparent 32%),linear-gradient(145deg,#070916,#0b1024 52%,#090b19)!important;color:#f5f7ff}

async function api(action,body={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  let r;
  try{r=await fetch(API,{signal:controller.signal,method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,...(token?{"x-helligram-token":token}:{})},body:JSON.stringify({action,...body})});}catch(e){throw new Error(e.name==="AbortError"?"پاسخ سرور بیش از ۱۰ ثانیه طول کشید. اتصال Supabase را بررسی کنید.":e.message)}finally{clearTimeout(timer)}
  let data={};try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data.error||"خطا در ارتباط با سرور");
  return data;
}

function busy(text){$("error").textContent=text}
async function loginStudent(){
  const rawId=$("nationalId").value.trim(); const id=rawId.replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776)).replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632)); if(!/^\d{10}$/.test(id)) return busy("کد ملی باید ۱۰ رقم باشد.");
  busy("در حال ورود...");
  try{const d=await api("login",{type:"student",national_id:id}); token=d.token;profile=d.profile;localStorage.setItem("helligram_token",token);openApp()}catch(e){busy(e.message)}
}
async function loginStaff(){
  const code=$("staffCode").value.trim(),pass=$("staffPass").value;
  if(!code||!pass)return busy("کد ورود و رمز عبور را وارد کنید.");
  busy("در حال ورود...");
  try{const d=await api("login",{type:"staff",login_code:code,password:pass});token=d.token;profile=d.profile;localStorage.setItem("helligram_token",token);openApp()}catch(e){busy(e.message)}
}

  $("roleNotice").textContent=profile.type==="staff"?"ورود مسئول فعال است.":"دانش آموز | وضعیت ارسال: "+(profile.canWrite?"فعال":"بسته");
  $("adminBtn").classList.toggle("hidden",profile.type!=="staff");
  setProfileAvatar();
  showChat();refreshAll();
  setTimeout(handleCallLink,300);
}
async function uploadAvatar(input){
  const file=input.files?.[0];
  if(!file)return;
  const status=document.getElementById("avatarStatus");
  const allowed=["image/jpeg","image/png","image/webp"];
  if(!allowed.includes(file.type)){status.textContent="فقط JPG، PNG یا WebP مجاز است.";input.value="";return;}
  if(file.size>3*1024*1024){status.textContent="حجم عکس زیاد است؛ حداکثر ۳ مگابایت.";input.value="";return;}
  status.textContent="در حال آماده سازی عکس...";
  try{
    const dataUrl=await resizeAvatar(file);
    status.textContent="در حال آپلود...";
    const d=await api("upload_avatar",{data_url:dataUrl});
    profile.avatarUrl=d.avatarUrl||"";
    setProfileAvatar();
    await refreshAll();
    status.textContent="عکس پروفایل با موفقیت تغییر کرد.";
  }catch(e){
    status.textContent=e.message;
  }finally{input.value="";}
}
async function uploadGroupAvatar(groupId,input){
  const file=input.files?.[0];
  if(!file)return;
  const allowed=["image/jpeg","image/png","image/webp"];
  if(!allowed.includes(file.type)){alert("فقط JPG، PNG یا WebP مجاز است.");input.value="";return;}
  if(file.size>3*1024*1024){alert("حجم عکس زیاد است؛ حداکثر ۳ مگابایت.");input.value="";return;}
  try{
    const dataUrl=await resizeAvatar(file);
    await api("upload_group_avatar",{group_id:groupId,data_url:dataUrl});
    await refreshAll();
  }catch(e){alert(e.message)}
  finally{input.value="";}
}
function resizeAvatar(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=512,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/webp",.82));
      };
      img.onerror=()=>reject(new Error("خواندن عکس انجام نشد."));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("خواندن فایل انجام نشد."));
    reader.readAsDataURL(file);
  });
}
let refreshInFlight=false;
async function refreshAll(){
  if(refreshInFlight)return;
  refreshInFlight=true;
  try{
    const m=await api("messages");
    messages=m.messages||[];
    renderMessages();
    const g=await api("groups");
    groups=g.groups||[];
    if(profile?.type==="staff"){
      const s=await api("students");
      students=s.students||[];
      const st=await api("staff_directory");
      staff=st.staff||[];
      renderAdmin();
    }else{
      const st=await api("staff_directory");
      staff=st.staff||[];
    }
    renderTargets();
    renderChatList();
    updateUnreadIndicator();
  }catch(e){
    chatStatus.textContent=e.message;
  }finally{
    refreshInFlight=false;
  }
}
function toggleMenu(force){const menu=document.getElementById("sideMenu"),overlay=document.getElementById("menuOverlay");const open=force===undefined?!menu.classList.contains("open"):!!force;menu.classList.toggle("open",open);overlay.classList.toggle("show",open)}
function showChat(){adminPanel.style.display="none";showChatList()}
function getTargetOptions(){
  const options=[];
  if(profile?.type==="student"){
    staff.forEach(x=>options.push({value:"staff:"+x.id,label:"👤 مسئول: "+x.full_name,kind:"staff",id:x.id}));
    groups.forEach(x=>options.push({value:"group:"+x.id,label:"👥 گروه: "+x.name,kind:"group",id:x.id}));
  }else{
    students.forEach(x=>options.push({value:"student:"+x.id,label:"🎓 دانش آموز: "+x.full_name,kind:"student",id:x.id}));
    staff.forEach(x=>options.push({value:"staff:"+x.id,label:"👤 مسئول: "+x.full_name,kind:"staff",id:x.id}));
    groups.forEach(x=>options.push({value:"group:"+x.id,label:"👥 گروه: "+x.name,kind:"group",id:x.id}));
  }
  return options;
}
function renderTargets(){
  const select=document.getElementById("targetSelect");
  if(!select||!profile)return;
  const options=getTargetOptions();
  if(!options.length){
    select.innerHTML='<option value="">مقصدی ثبت نشده است</option>';
    sendTarget={kind:"",id:null};
    return;
  }
  const current=options.find(x=>x.kind===sendTarget.kind&&x.id===sendTarget.id)||options[0];
  select.innerHTML=options.map(x=>'<option value="'+x.value+'">'+escapeHtml(x.label)+'</option>').join("");
  select.value=current.value;
  sendTarget={kind:current.kind,id:current.id};
}
function chatKey(m){
  if(m.group_id)return "group:"+m.group_id;
  if(profile.type==="student"){
    if(m.recipient_student_id===profile.id)return "student:"+m.sender_student_id;
    if(m.sender_student_id===profile.id&&m.recipient_student_id)return "student:"+m.recipient_student_id;
    if(m.recipient_staff_id===profile.id)return "staff:"+m.sender_staff_id;
    if(m.sender_student_id===profile.id&&m.recipient_staff_id)return "staff:"+m.recipient_staff_id;
  }else{
    if(m.sender_staff_id===profile.id&&m.recipient_student_id)return "student:"+m.recipient_student_id;
    if(m.recipient_staff_id===profile.id&&m.sender_staff_id)return "staff:"+m.sender_staff_id;
    if(m.sender_staff_id!==profile.id&&m.sender_staff_id)return "staff:"+m.sender_staff_id;
    if(m.sender_student_id)return "student:"+m.sender_student_id;
  }
  return null;
}
function chatMeta(key){
  const [kind,id]=String(key).split(":");
  if(kind==="group"){
    const g=groups.find(x=>x.id===id);
    return {kind,id,name:g?.name||"گروه",icon:"👥",avatarUrl:g?.avatar_url||"",memberCount:g?.member_count||0,writeDisabled:!!g?.write_disabled};
  }
  if(kind==="student"){
    const x=students.find(x=>x.id===id);
    return {kind,id,name:x?.full_name||"دانش آموز",icon:"🎓",avatarUrl:x?.avatar_url||""};
  }
  const x=staff.find(x=>x.id===id);
  return {kind,id,name:x?.full_name||"مسئول",icon:"👤",avatarUrl:x?.avatar_url||""};
}
function faNum(n){return String(n??0).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[Number(d)])}
function formatChatTime(date){
  const d=new Date(date);
  const now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("fa-IR",{month:"numeric",day:"numeric"});
}

async function joinCallFromLink(callId){if(!profile||!callId||activeCall||callJoiningFromLink)return;callJoiningFromLink=true;try{const d=await api("call_poll",{call_id:callId});const call=(d.calls||[])[0];if(!call)throw new Error("این لینک تماس منقضی شده یا تماس پیدا نشد.");if(call.callee_type!==profile.type||call.callee_id!==profile.id)throw new Error("این تماس برای حساب شما نیست.");if(call.status!=="ringing"||!call.offer||!Number.isFinite(new Date(call.created_at).getTime())||Date.now()-new Date(call.created_at).getTime()>120000)throw new Error("این تماس دیگر فعال نیست.");const hasVideo=String(call.offer.sdp||"").split("\n").some(line=>line.startsWith("m=video ")&&!line.startsWith("m=video 0"));callMode=hasVideo?"video":"audio";activeCall={id:call.id,peerType:call.caller_type,peerId:call.caller_id,role:"callee",offer:call.offer,mode:callMode};callIceSeen=new Set((d.ice||[]).map(x=>x.id));callIceQueue=(d.ice||[]).filter(x=>x.sender_id!==profile.id).map(x=>x.candidate);const pm=callPeerMeta({type:call.caller_type,id:call.caller_id});document.getElementById("callName").textContent=pm.name;document.getElementById("callState").textContent=callMode==="audio"?"تماس صوتی ورودی":"تماس تصویری ورودی";callAvatar(pm);resetCallUi();document.getElementById("videoStage")?.classList.toggle("hidden",callMode!=="video");document.getElementById("callAcceptBtn")?.classList.remove("hidden");callUi(true)}catch(e){alert(e.message||"ورود به تماس انجام نشد.")}finally{callJoiningFromLink=false;if(location.hash.startsWith("#call="))history.replaceState(null,"",location.pathname+location.search)}}

async function toggleScreenShare(){
  if(screenSharing){await stopScreenShare();return}
  if(!activeCall||callMode!=="video")return;
  const md=navigator.mediaDevices;
  if(!window.isSecureContext||!md?.getDisplayMedia){
    alert("اشتراک صفحه در این مرورگر موبایل در دسترس نیست. اگر با موبایل هستید، از Chrome به روز و نسخه HTTPS حلی گرام استفاده کنید.");
    return;
  }
  try{
    const supported=md.getSupportedConstraints?md.getSupportedConstraints():{};
    const video={};
    if(supported.displaySurface)video.displaySurface="browser";
    const stream=await md.getDisplayMedia({video,audio:false});
    const track=stream.getVideoTracks()[0];
    if(!track)throw new Error("تصویر صفحه دریافت نشد.");
    screenShareStream=stream;
    screenSharing=true;
    const targets=[];
    if(activeCall&&callPeer)targets.push(callPeer);
    
    let replaced=0;
    for(const pc of targets){
      const sender=pc.getSenders().find(s=>s.track?.kind==="video");
      if(sender){await sender.replaceTrack(track);replaced++}
    }
    if(!replaced)throw new Error("کانال تصویر برای اشتراک صفحه آماده نیست.");
    const local=document.getElementById("localVideo");
    if(local){local.srcObject=stream;local.style.display="block";local.play().catch(()=>{})}
    const btn=document.getElementById("callShareBtn");
    if(btn)btn.textContent="⏹️";
    const state=document.getElementById("callState");
    if(state)state.textContent="در حال اشتراک گذاری صفحه";
    track.onended=()=>{if(screenSharing)stopScreenShare()};
  }catch(e){
    if(screenShareStream){screenShareStream.getTracks().forEach(t=>t.stop());screenShareStream=null}
    screenSharing=false;
    const msg=e.name==="NotAllowedError"?"اجازه اشتراک صفحه داده نشد یا اشتراک لغو شد.":e.name==="NotFoundError"?"منبعی برای اشتراک صفحه روی این دستگاه پیدا نشد.":e.name==="NotReadableError"?"سیستم عامل یا مرورگر اجازه خواندن صفحه را نداد.":(e.message||"اشتراک صفحه شروع نشد.");
    alert(msg+"\n\nنکته: بعضی مرورگرهای موبایل اصلا Screen Share وب را پشتیبانی نمی کنند.");
  }
}
async function stopScreenShare(){
  const cameraTrack=callLocalStream?.getVideoTracks?.()[0];
  const targets=[];
  if(activeCall&&callPeer)targets.push(callPeer);
  
  if(cameraTrack)for(const pc of targets){
    const sender=pc.getSenders().find(s=>s.track?.kind==="video");
    if(sender)await sender.replaceTrack(cameraTrack).catch(()=>{});
  }
  if(screenShareStream){screenShareStream.getTracks().forEach(t=>t.stop());screenShareStream=null}
  screenSharing=false;
  const local=document.getElementById("localVideo");
  const cameraStream=callLocalStream;
  if(local&&cameraStream){local.srcObject=cameraStream;local.style.display="block";local.play().catch(()=>{})}
  const btn=document.getElementById("callShareBtn");
  if(btn)btn.textContent="🖥️";
  const state=document.getElementById("callState");
  if(state)state.textContent=callMode==="audio"?"تماس صوتی برقرار است":"تماس تصویری برقرار است";
}

let voiceRecorder=null,voiceChunks=[],voiceStartedAt=0,voiceClock=null;
function voiceMimeType(){
  return ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
}
function voiceNotice(text,show=true){
  const el=document.getElementById("voiceStatus");if(!el)return;
  el.textContent=text;el.classList.toggle("hidden",!show);
}
async function toggleVoiceRecording(){
  if(voiceRecorder&&voiceRecorder.state==="recording"){voiceRecorder.stop();return}
  if(!profile||!selectedChat||!sendTarget.id){alert("ابتدا یک گفتگو را باز کنید.");return}
  if(profile.type==="student"&&!profile.canWrite){alert("ارسال پیام برای شما بسته شده است.");return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert("ضبط صدا در این مرورگر پشتیبانی نمی‌شود. از مرورگر به‌روز و HTTPS استفاده کنید.");return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mimeType=voiceMimeType();
    voiceChunks=[];
    voiceRecorder=new MediaRecorder(stream,mimeType?{mimeType}:undefined);
    voiceStartedAt=Date.now();
    const btn=document.getElementById("voiceBtn");
    btn.classList.add("recording");btn.textContent="■";btn.setAttribute("aria-label","پایان ضبط و ارسال");
    voiceNotice("در حال ضبط 00:00");
    voiceClock=setInterval(()=>{
      if(!voiceRecorder||voiceRecorder.state!=="recording")return;
      const sec=Math.floor((Date.now()-voiceStartedAt)/1000);
      voiceNotice("در حال ضبط "+String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"));
      if(sec>=60)voiceRecorder.stop();
    },250);
    voiceRecorder.ondataavailable=e=>{if(e.data&&e.data.size)voiceChunks.push(e.data)};
    voiceRecorder.onerror=()=>{stream.getTracks().forEach(t=>t.stop());resetVoiceRecorder();alert("ضبط صدا با خطا مواجه شد.")};
    voiceRecorder.onstop=async()=>{
      clearInterval(voiceClock);voiceClock=null;
      stream.getTracks().forEach(t=>t.stop());
      const recorder=voiceRecorder;
      const blob=new Blob(voiceChunks,{type:recorder?.mimeType||mimeType||"audio/webm"});
      resetVoiceRecorder();
      if(!blob.size){voiceNotice("",false);return}
      if(blob.size>1_500_000){voiceNotice("",false);alert("حجم پیام صوتی زیاد است. یک پیام کوتاه‌تر ضبط کنید.");return}
      try{
        voiceNotice("در حال ارسال پیام صوتی…");
        const dataUrl=await new Promise((resolve,reject)=>{
          const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).replace(/^data:audio\\/(webm|ogg);codecs=opus;base64,/,"data:audio/$1;base64,"));reader.onerror=()=>reject(new Error("خواندن فایل صوتی انجام نشد."));reader.readAsDataURL(blob);
        });
        const uploaded=await api("upload_voice",{data_url:dataUrl});
        const body={content:"[[voice:"+uploaded.path+"]]"};
        if(sendTarget.kind==="staff")body.recipient_staff_id=sendTarget.id;
        else if(sendTarget.kind==="student")body.recipient_student_id=sendTarget.id;
        else if(sendTarget.kind==="group")body.group_id=sendTarget.id;
        else throw new Error("مقصد پیام معتبر نیست.");
        await api("send",body);
        await refreshAll();openChat(selectedChat);
        voiceNotice("پیام صوتی ارسال شد.");setTimeout(()=>voiceNotice("",false),1800);
      }catch(e){voiceNotice("",false);alert(e.message||"ارسال پیام صوتی انجام نشد.")}
    };
    voiceRecorder.start(250);
  }catch(e){resetVoiceRecorder();alert(e.name==="NotAllowedError"?"اجازه استفاده از میکروفون داده نشد.":(e.message||"میکروفون در دسترس نیست."))}
}
function resetVoiceRecorder(){
  clearInterval(voiceClock);voiceClock=null;
  const btn=document.getElementById("voiceBtn");
  if(btn){btn.classList.remove("recording");btn.textContent="🎙️";btn.setAttribute("aria-label","ضبط پیام صوتی")}
  voiceRecorder=null;voiceChunks=[];
}

async function sendMessage(){
  const input=document.getElementById("messageInput");
  const btn=document.getElementById("sendBtn");
  const content=input.value.trim();
  if(!content)return;
  if(profile.type==="student"&&!profile.canWrite){
    alert("ارسال پیام برای شما بسته شده است.");
    return;
  }

  btn.disabled=true;
  btn.textContent="...";
  try{
    const body={content};
    if(!sendTarget.id) return alert("ابتدا مقصد پیام را انتخاب کنید.");
    if(sendTarget.kind==="staff") body.recipient_staff_id=sendTarget.id;
    if(sendTarget.kind==="student") body.recipient_student_id=sendTarget.id;
    if(sendTarget.kind==="group") body.group_id=sendTarget.id;
    await api("send",body);
    input.value="";
    if(sendTarget.id) selectedChat=sendTarget.kind+":"+sendTarget.id;
    await refreshAll();
    openChat(selectedChat);
  }catch(e){
    alert(e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="ارسال";
  }
}

  }catch(e){alert(e.message)}
}
async function pinMessage(messageId){try{await api("pin_message",{message_id:messageId});await refreshAll();if(selectedChat){renderConversation();renderPinnedHeader()}}catch(e){alert(e.message)}}
async function unpinMessage(messageId){try{await api("unpin_message",{message_id:messageId});await refreshAll();if(selectedChat){renderConversation();renderPinnedHeader()}}catch(e){alert(e.message)}}
async function logout(){token="";profile=null;localStorage.removeItem("helligram_token");$("app").style.display="none";$("login").style.display="block";$("nationalId").value="";$("staffCode").value="";$("staffPass").value="";setMode("student")}
async function restore(){
  if(!token)return;
  try{const d=await api("me");profile=d.profile;openApp()}catch{token="";localStorage.removeItem("helligram_token")}
}
let messagesEl=null,messagesBox=null;
updateNotificationButton();
setInterval(updateCallTimer,1000);
restore();
setInterval(()=>{if(profile)refreshAll()},4000);
</script>
