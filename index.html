radius:12px;background:#172b45;margin-bottom:10px;font-size:13px}.admin{margin:14px 0;padding:18px;display:none;background:#0f1d30}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{max-height:250px;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #263c59}.row .btn{width:auto;margin:0;padding:8px 10px;font-size:12px}.hidden{display:none!important}.chatEmpty{padding:45px 22px;text-align:center;color:#82878e}.chatEmpty strong{display:block;color:#e5e7ea;margin-bottom:8px}.status{font-size:11px;margin-top:5px}.version{text-align:center;color:#566b84;font-size:9px;margin-top:12px}@media(max-width:760px){.grid{display:block}.chat{min-height:calc(100vh - 82px)}.chatList{min-height:calc(100vh - 148px)}.messages{min-height:350px}.adminGrid{grid-template-columns:1fr}.msg{max-width:92%}.wrap{padding:0}.chatItem{padding:13px 12px}.chatAvatar{width:53px;height:53px;flex-basis:53px}.chatName{font-size:15px}.appHeader{height:74px}.chat{min-height:calc(100vh - 74px)}}

<body>
<div class="wrap">
<section id="login" class="card login">
  <div class="brand"><div class="logo"><img src="logo.png" alt="لوگوی حلی گرام"></div><h1>حلی گرام</h1><p class="muted">پیام رسان مدرسه</p></div>
  <div class="tabs"><button id="studentTab" class="active" onclick="setMode('student')">دانش آموز</button><button id="staffTab" onclick="setMode('staff')">مسئولین</button></div>
  <div id="studentForm"><div class="field"><label>کد ملی</label><input id="nationalId" inputmode="numeric" maxlength="10" placeholder="کد ملی را وارد کنید"></div><button class="btn primary" onclick="loginStudent()">ورود به حلی گرام</button></div>
  <div id="staffForm" class="hidden"><div class="field"><label>کد ورود مسئول</label><input id="staffCode" placeholder="کد اختصاصی مسئول"></div><div class="field"><label>رمز عبور</label><input id="staffPass" type="password" placeholder="رمز مسئولین"></div><button class="btn primary" onclick="loginStaff()">ورود مسئول</button></div>
  <div id="error" class="error"></div>
  <div class="version">v0.5.5</div>
</section>

<section id="app" class="app">
  <div class="appHeader">
    <button class="iconBtn" onclick="toggleMenu()" aria-label="منو">☰</button>
    <div class="appBrand"><div class="appLogo"><img src="logo.png" alt="حلی گرام"></div><div class="appBrandText"><b>حلی گرام</b><small id="who"></small></div></div>
    
  </div>
  <div id="menuOverlay" class="menuOverlay" onclick="toggleMenu(false)"></div>
  <div class="grid">
    <aside id="sideMenu" class="card side">
      <button class="menuClose" onclick="toggleMenu(false)">×</button>
      <div class="menuTitle">منوی حلی گرام</div>
      <div class="profileBox">
        <div id="profileAvatar" class="profileAvatar"></div>
        <div id="profileName" class="profileName"></div>
        <input id="avatarInput" class="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadAvatar(this)">
        <button class="btn avatarBtn" type="button" onclick="document.getElementById('avatarInput').click()">📷 تغییر عکس پروفایل</button>
        <div id="avatarStatus" class="status muted"></div>
      </div>
      <div class="notice" id="roleNotice"></div>
      <button class="btn primary" onclick="showChat();toggleMenu(false)">💬 پیام رسان</button>
      <button class="btn" id="adminBtn" onclick="toggleAdmin();toggleMenu(false)">🛡️ پنل مدیریت</button>
      <button class="btn" onclick="refreshAll();toggleMenu(false)">🔄 بروزرسانی</button>
      <button class="btn" onclick="logout()">🚪 خروج از حساب</button>
    </aside>
    <main class="card chat">
      <div class="chathead">
        <button id="backChats" class="chatBack" onclick="showChatList()">‹</button>
        <div id="chatHeaderAvatar" class="chatHeaderAvatar">👥</div><div class="chatTitleWrap"><b id="chatTitle">گفتگوها</b><div class="muted" id="chatStatus">پیام های شما</div></div>
        
      </div>
      <div id="chatList" class="chatList"></div>
      <div id="conversation" class="conversation hidden">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <button class="iconBtn composerPlus" type="button" onclick="openNewChat()" aria-label="گفتگوی جدید">＋</button>
          <textarea id="messageInput" placeholder="پیام خود را بنویسید..." maxlength="5000"></textarea>
          <button id="emojiBtn" class="iconBtn" type="button" onclick="insertEmoji()" aria-label="ایموجی">☺</button><button id="sendBtn" class="btn primary" onclick="sendMessage()">ارسال</button>
        </div>
      </div>
    </main>
  </div>

  <section id="adminPanel" class="card admin">
    <h3>پنل مدیریت</h3>
    <div class="adminGrid">
      <div>
        <h4>کنترل دانش آموزان</h4>
        <div id="studentList" class="list"></div>
      </div>
      <div>
        <h4>کنترل گروه ها</h4>
        <div id="groupList" class="list"></div>
      </div>
    </div>
    <div class="groupTools">
      <h4>مدیریت گروه ها</h4>
      <div class="field"><input id="newGroupName" placeholder="نام گروه جدید"></div>
      <button class="btn primary" onclick="createGroup()">ساخت گروه</button>
      <div class="field"><label>انتخاب گروه</label><select id="manageGroupSelect" onchange="loadGroupMembers()"></select></div>
      <div class="field"><label>دانش آموز</label><select id="manageStudentSelect"></select></div>
      <div class="row"><button class="btn" onclick="changeGroupMember(true)">افزودن به گروه</button><button class="btn" onclick="changeGroupMember(false)">حذف از گروه</button></div>
      <div id="groupMemberStatus" class="status muted"></div>
    </div>
    <h4>پیام های اخیر</h4>
    <div id="adminMessages" class="list"></div>
  </section>
  <div class="version">v0.5.5</div>
</section>
</div>

<script>
const SUPABASE_URL="https://pwwicgyrycaexjnnhseb.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3d2ljZ3lyeWNhZXhqbm5oc2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzczMjgsImV4cCI6MjEwNjYxMzMyOH0.860RskDmycONZUHyOloN8AmKqRkzU5YNXUUze2DuPdM";
const API=SUPABASE_URL+"/functions/v1/helligram-api";
let token=localStorage.getItem("helligram_token")||"";
let profile=null;
let mode="student";
let groups=[];
let students=[];
let staff=[];
let messages=[];
let sendTarget={kind:"staff",id:null};
let selectedChat=null;

async function api(action,body={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  let r;
  try{r=await fetch(API,{signal:controller.signal,method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,...(token?{"x-helligram-token":token}:{})},body:JSON.stringify({action,...body})});}catch(e){throw new Error(e.name==="AbortError"?"پاسخ سرور بیش از ۱۰ ثانیه طول کشید. اتصال Supabase را بررسی کنید.":e.message)}finally{clearTimeout(timer)}
  let data={};try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data.error||"خطا در ارتباط با سرور");
  return data;
}
function setMode(m){mode=m;studentForm.classList.toggle("hidden",m!=="student");staffForm.classList.toggle("hidden",m!=="staff");studentTab.classList.toggle("active",m==="student");staffTab.classList.toggle("active",m==="staff");error.textContent=""}
function busy(text){error.textContent=text}
async function loginStudent(){
  const rawId=nationalId.value.trim(); const id=rawId.replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776)).replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632)); if(!/^\d{10}$/.test(id)) return busy("کد ملی باید ۱۰ رقم باشد.");
  busy("در حال ورود...");
  try{const d=await api("login",{type:"student",national_id:id}); token=d.token;profile=d.profile;localStorage.setItem("helligram_token",token);openApp()}catch(e){busy(e.message)}
}
async function loginStaff(){
  const code=staffCode.value.trim(),pass=staffPass.value;
  if(!code||!pass)return busy("کد ورود و رمز عبور را وارد کنید.");
  busy("در حال ورود...");
  try{const d=await api("login",{type:"staff",login_code:code,password:pass});token=d.token;profile=d.profile;localStorage.setItem("helligram_token",token);openApp()}catch(e){busy(e.message)}
}
function setProfileAvatar(){
  const el=document.getElementById("profileAvatar");
  const nameEl=document.getElementById("profileName");
  if(!el||!profile)return;
  nameEl.textContent=profile.name||"کاربر";
  const letter=escapeHtml((profile.name||"?").trim().slice(0,1));
  el.innerHTML=profile.avatarUrl
    ? '<img src="'+escapeHtml(profile.avatarUrl)+'" alt="عکس پروفایل">'
    : letter;
}
function openApp(){
  login.style.display="none";app.style.display="block";who.textContent=profile.name+(profile.className?" | "+profile.className:"");
  roleNotice.textContent=profile.type==="staff"?"ورود مسئول فعال است.":"دانش آموز | وضعیت ارسال: "+(profile.canWrite?"فعال":"بسته");
  adminBtn.classList.toggle("hidden",profile.type!=="staff");
  setProfileAvatar();
  showChat();refreshAll();
}
async function uploadAvatar(input){
  const file=input.files?.[0];
  if(!file)return;
  const status=document.getElementById("avatarStatus");
  const allowed=["image/jpeg","image/png","image/webp"];
  if(!allowed.includes(file.type)){status.textContent="فقط JPG، PNG یا WebP مجاز است.";input.value="";return;}
  if(file.size>3*1024*1024){status.textContent="حجم عکس زیاد است؛ حداکثر ۳ مگابایت.";input.value="";return;}
  status.textContent="در حال آماده سازی عکس...";
  try{
    const dataUrl=await resizeAvatar(file);
    status.textContent="در حال آپلود...";
    const d=await api("upload_avatar",{data_url:dataUrl});
    profile.avatarUrl=d.avatarUrl||"";
    setProfileAvatar();
    await refreshAll();
    status.textContent="عکس پروفایل با موفقیت تغییر کرد.";
  }catch(e){
    status.textContent=e.message;
  }finally{input.value="";}
}
async function uploadGroupAvatar(groupId,input){
  const file=input.files?.[0];
  if(!file)return;
  const allowed=["image/jpeg","image/png","image/webp"];
  if(!allowed.includes(file.type)){alert("فقط JPG، PNG یا WebP مجاز است.");input.value="";return;}
  if(file.size>3*1024*1024){alert("حجم عکس زیاد است؛ حداکثر ۳ مگابایت.");input.value="";return;}
  try{
    const dataUrl=await resizeAvatar(file);
    await api("upload_group_avatar",{group_id:groupId,data_url:dataUrl});
    await refreshAll();
  }catch(e){alert(e.message)}
  finally{input.value="";}
}
function resizeAvatar(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=512,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/webp",.82));
      };
      img.onerror=()=>reject(new Error("خواندن عکس انجام نشد."));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("خواندن فایل انجام نشد."));
    reader.readAsDataURL(file);
  });
}
async function refreshAll(){
  try{
    const m=await api("messages");
    messages=m.messages||[];
    renderMessages();
    const g=await api("groups");
    groups=g.groups||[];
    if(profile?.type==="staff"){
      const s=await api("students");
      students=s.students||[];
      const st=await api("staff_directory");
      staff=st.staff||[];
      renderAdmin();
    }else{
      const st=await api("staff_directory");
      staff=st.staff||[];
    }
    renderTargets();
  }catch(e){
    chatStatus.textContent=e.message;
  }
}
function toggleMenu(force){const menu=document.getElementById("sideMenu"),overlay=document.getElementById("menuOverlay");const open=force===undefined?!menu.classList.contains("open"):!!force;menu.classList.toggle("open",open);overlay.classList.toggle("show",open)}
function showChat(){adminPanel.style.display="none";showChatList()}
function getTargetOptions(){
  const options=[];
  if(profile?.type==="student"){
    staff.forEach(x=>options.push({value:"staff:"+x.id,label:"👤 مسئول: "+x.full_name,kind:"staff",id:x.id}));
    groups.forEach(x=>options.push({value:"group:"+x.id,label:"👥 گروه: "+x.name,kind:"group",id:x.id}));
  }else{
    students.forEach(x=>options.push({value:"student:"+x.id,label:"🎓 دانش آموز: "+x.full_name,kind:"student",id:x.id}));
    staff.forEach(x=>options.push({value:"staff:"+x.id,label:"👤 مسئول: "+x.full_name,kind:"staff",id:x.id}));
    groups.forEach(x=>options.push({value:"group:"+x.id,label:"👥 گروه: "+x.name,kind:"group",id:x.id}));
  }
  return options;
}
function renderTargets(){
  const select=document.getElementById("targetSelect");
  if(!select||!profile)return;
  const options=getTargetOptions();
  if(!options.length){
    select.innerHTML='<option value="">مقصدی ثبت نشده است</option>';
    sendTarget={kind:"",id:null};
    return;
  }
  const current=options.find(x=>x.kind===sendTarget.kind&&x.id===sendTarget.id)||options[0];
  select.innerHTML=options.map(x=>'<option value="'+x.value+'">'+escapeHtml(x.label)+'</option>').join("");
  select.value=current.value;
  sendTarget={kind:current.kind,id:current.id};
}
function chatKey(m){
  if(m.group_id)return "group:"+m.group_id;
  if(profile.type==="student"){
    if(m.recipient_student_id===profile.id)return "student:"+m.sender_student_id;
    if(m.sender_student_id===profile.id&&m.recipient_student_id)return "student:"+m.recipient_student_id;
    if(m.recipient_staff_id===profile.id)return "staff:"+m.sender_staff_id;
    if(m.sender_student_id===profile.id&&m.recipient_staff_id)return "staff:"+m.recipient_staff_id;
  }else{
    if(m.sender_staff_id===profile.id&&m.recipient_student_id)return "student:"+m.recipient_student_id;
    if(m.recipient_staff_id===profile.id&&m.sender_staff_id)return "staff:"+m.sender_staff_id;
    if(m.sender_staff_id!==profile.id&&m.sender_staff_id)return "staff:"+m.sender_staff_id;
    if(m.sender_student_id)return "student:"+m.sender_student_id;
  }
  return null;
}
function chatMeta(key){
  const [kind,id]=String(key).split(":");
  if(kind==="group"){
    const g=groups.find(x=>x.id===id);
    return {kind,id,name:g?.name||"گروه",icon:"👥",avatarUrl:g?.avatar_url||"",memberCount:g?.member_count||0};
  }
  if(kind==="student"){
    const x=students.find(x=>x.id===id);
    return {kind,id,name:x?.full_name||"دانش آموز",icon:"🎓",avatarUrl:x?.avatar_url||""};
  }
  const x=staff.find(x=>x.id===id);
  return {kind,id,name:x?.full_name||"مسئول",icon:"👤",avatarUrl:x?.avatar_url||""};
}
function faNum(n){return String(n??0).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[Number(d)])}
function formatChatTime(date){
  const d=new Date(date);
  const now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("fa-IR",{month:"numeric",day:"numeric"});
}
function renderChatList(){
  const el=document.getElementById("chatList");
  if(!el)return;
  const map=new Map();
  messages.forEach(m=>{
    const key=chatKey(m);
    if(key)map.set(key,m);
  });
  const rows=[...map.entries()].sort((a,b)=>new Date(b[1].created_at)-new Date(a[1].created_at));
  if(!rows.length){
    el.innerHTML='<div class="chatEmpty"><strong>هنوز گفتگویی ندارید</strong>برای شروع، یک گفتگوی جدید را از منوی برنامه انتخاب کنید.</div>';
    return;
  }
  el.innerHTML=rows.map(([key,last])=>{
    const meta=chatMeta(key);
    const preview=(last.sender_name?last.sender_name+" : ":"")+last.content;
    const avatar=meta.kind==="student"||meta.kind==="staff"||meta.kind==="group"
      ? (meta.avatarUrl
        ? '<div class="chatAvatar"><img src="'+escapeHtml(meta.avatarUrl)+'" alt=""></div>'
        : '<div class="chatAvatar">'+escapeHtml((meta.name||"?").trim().slice(0,1))+'</div>')
      : '<div class="chatAvatar">'+meta.icon+'</div>';
    return '<div class="chatItem" onclick="openChat(\''+escapeHtml(key)+'\')">'+avatar+
      '<div class="chatInfo"><div class="chatTopLine"><span class="chatName">'+escapeHtml(meta.name)+'</span><span class="chatTime">'+formatChatTime(last.created_at)+'</span></div>'+
      (meta.kind==="group" ? '<div class="groupMemberCount">'+faNum(meta.memberCount)+' عضو</div>' : '<div class="chatPreview">'+escapeHtml(preview)+'</div>')+'</div></div>';
  }).join("");
}
function setChatVisualMode(kind,avatarUrl){
  const chat=document.querySelector(".chat");
  const avatar=document.getElementById("chatHeaderAvatar");
  const isGroup=kind==="group";
  chat.classList.toggle("groupChat",isGroup);
  avatar.classList.toggle("show",isGroup);
  avatar.innerHTML=isGroup?(avatarUrl?"<img src=\""+escapeHtml(avatarUrl)+"\" alt=\"عکس گروه\">":"👥"):"";
}
function insertEmoji(){
  const input=document.getElementById("messageInput");
  input.value+=(input.value?" ":"")+"🙂";
  input.focus();
}
function showChatList(){
  selectedChat=null;
  setChatVisualMode("");
  document.getElementById("chatList").classList.remove("hidden");
  document.getElementById("conversation").classList.add("hidden");
  document.getElementById("backChats").classList.add("hidden");
  document.getElementById("chatTitle").textContent="گفتگوها";
  document.getElementById("chatStatus").textContent="پیام های شما";
  renderChatList();
}
function openChat(key){
  selectedChat=key;
  const meta=chatMeta(key);
  setChatVisualMode(meta.kind,meta.avatarUrl);
  sendTarget={kind:meta.kind,id:meta.id};
  document.getElementById("chatList").classList.add("hidden");
  document.getElementById("conversation").classList.remove("hidden");
  document.getElementById("backChats").classList.remove("hidden");
  document.getElementById("chatTitle").textContent=meta.name;
  document.getElementById("chatStatus").textContent=meta.kind==="group"?"گروه":"گفتگوی خصوصی";
  renderTargets();
  renderConversation();
}
function openNewChat(){
  setChatVisualMode("");
  document.getElementById("chatList").classList.add("hidden");
  document.getElementById("conversation").classList.remove("hidden");
  document.getElementById("backChats").classList.remove("hidden");
  document.getElementById("chatTitle").textContent="گفتگوی جدید";
  document.getElementById("chatStatus").textContent="یک مقصد انتخاب کنید";
  renderTargets();
  const select=document.getElementById("targetSelect");
  if(select?.value)setTarget(select.value);
  renderConversation();
}
function renderConversation(){
  const el=document.getElementById("messages");
  if(!selectedChat){
    el.innerHTML='<div class="chatEmpty"><strong>گفتگوی جدید</strong>مقصد را انتخاب کنید و پیام خود را بفرستید.</div>';
    return;
  }
  const list=messages.filter(m=>chatKey(m)===selectedChat);
  if(!list.length){el.innerHTML='<div class="chatEmpty"><strong>هنوز پیامی نیست</strong>اولین پیام را ارسال کنید.</div>';return;}
  el.innerHTML=list.map(m=>{
    const mine=profile.type==="student"?m.sender_student_id===profile.id:m.sender_staff_id===profile.id;
    const canDelete=mine||(profile.type==="staff"&&profile.role==="admin");
    const deleteButton=canDelete?'<button class="btn delete-msg" onclick="deleteMessage(\''+m.id+'\')" type="button">حذف پیام</button>':"";
    const senderName=m.sender_name||"کاربر";
    const avatarLetter=escapeHtml(senderName.trim().slice(0,1)||"?");
    const avatarHtml=m.sender_avatar_url
      ? '<div class="messageAvatar"><img src="'+escapeHtml(m.sender_avatar_url)+'" alt=""></div>'
      : '<div class="messageAvatar">'+avatarLetter+'</div>';
    return '<div class="messageLine '+(mine?"me":"")+'">'+avatarHtml+'<div class="msg '+(mine?"me":"")+'"><strong class="sender-name">'+escapeHtml(senderName)+'</strong><div>'+escapeHtml(m.content)+'</div><small>'+new Date(m.created_at).toLocaleString("fa-IR")+'</small>'+deleteButton+'</div></div>';
  }).join("");
  el.scrollTop=el.scrollHeight;
}
function setTarget(value){
  const [kind,id]=String(value||"").split(":");
  sendTarget={kind,id:id||null};
  if(!selectedChat){
    selectedChat=kind&&id?kind+":"+id:null;
    if(selectedChat){
      const meta=chatMeta(selectedChat);
      document.getElementById("chatTitle").textContent=meta.name;
      document.getElementById("chatStatus").textContent=meta.kind==="group"?"گروه":"گفتگوی خصوصی";
      setChatVisualMode(meta.kind,meta.avatarUrl);
      renderConversation();
    }
  }
}
async function createGroup(){
  const input=document.getElementById("newGroupName");
  const name=input.value.trim();
  if(!name)return alert("نام گروه را وارد کنید.");
  try{await api("create_group",{name});input.value="";await refreshAll()}catch(e){alert(e.message)}
}
async function loadGroupMembers(){
  const groupId=document.getElementById("manageGroupSelect").value;
  if(!groupId){groupMemberStatus.textContent="";return}
  try{
    const d=await api("group_members",{group_id:groupId});
    const sid=document.getElementById("manageStudentSelect").value;
    groupMemberStatus.textContent=(d.student_ids||[]).includes(sid)?"این دانش آموز عضو گروه است.":"این دانش آموز عضو گروه نیست.";
  }catch(e){groupMemberStatus.textContent=e.message}
}
async function changeGroupMember(member){
  const groupId=document.getElementById("manageGroupSelect").value;
  const studentId=document.getElementById("manageStudentSelect").value;
  if(!groupId||!studentId)return alert("گروه و دانش آموز را انتخاب کنید.");
  try{await api("set_group_member",{group_id:groupId,student_id:studentId,member});await loadGroupMembers()}catch(e){alert(e.message)}
}
function renderMessages(){renderChatList();if(selectedChat)renderConversation()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function sendMessage(){
  const input=document.getElementById("messageInput");
  const btn=document.getElementById("sendBtn");
  const content=input.value.trim();
  if(!content)return;
  if(profile.type==="student"&&!profile.canWrite){
    alert("ارسال پیام برای شما بسته شده است.");
    return;
  }

  btn.disabled=true;
  btn.textContent="...";
  try{
    const body={content};
    if(!sendTarget.id) return alert("ابتدا مقصد پیام را انتخاب کنید.");
    if(sendTarget.kind==="staff") body.recipient_staff_id=sendTarget.id;
    if(sendTarget.kind==="student") body.recipient_student_id=sendTarget.id;
    if(sendTarget.kind==="group") body.group_id=sendTarget.id;
    await api("send",body);
    input.value="";
    if(sendTarget.id) selectedChat=sendTarget.kind+":"+sendTarget.id;
    await refreshAll();
    openChat(selectedChat);
  }catch(e){
    alert(e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="ارسال";
  }
}
function toggleAdmin(){adminPanel.style.display=adminPanel.style.display==="none"?"block":"none";if(adminPanel.style.display==="block")renderAdmin()}
function renderAdmin(){
  studentList.innerHTML=students.map(s=>'<div class="row"><span>'+escapeHtml(s.full_name)+'<br><small class="muted">'+escapeHtml(s.class_name||"")+'</small></span><button class="btn" onclick="setStudentWrite(\''+s.id+'\','+s.can_write+')">'+(s.can_write?"بستن ارسال":"باز کردن ارسال")+'</button></div>').join("")||'<div class="notice">دانش آموزی ثبت نشده است.</div>';
  groupList.innerHTML=groups.map(g=>'<div class="row"><div style="display:flex;align-items:center;gap:8px;min-width:0"><div class="groupAvatarPreview">'+(g.avatar_url?'<img src="'+escapeHtml(g.avatar_url)+'" alt="">':'👥')+'</div><span>'+escapeHtml(g.name)+'</span></div><div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><input id="groupAvatarInput_'+g.id+'" class="groupAvatarInput" type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadGroupAvatar(\''+g.id+'\',this)"><button class="btn groupAvatarBtn" onclick="document.getElementById(\'groupAvatarInput_'+g.id+'\').click()" type="button">📷 عکس</button><button class="btn" onclick="setGroupWrite(\''+g.id+'\','+g.write_disabled+')">'+(g.write_disabled?"باز کردن گروه":"بستن گروه")+'</button></div></div>').join("")||'<div class="notice">گروهی ثبت نشده است.</div>';
  const gs=document.getElementById("manageGroupSelect");
  const ss=document.getElementById("manageStudentSelect");
  if(gs){gs.innerHTML=groups.map(g=>'<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>').join("")||'<option value="">گروهی نیست</option>';}
  if(ss){ss.innerHTML=students.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.full_name)+'</option>').join("")||'<option value="">دانش آموزی نیست</option>';}
  if(groups.length&&students.length)loadGroupMembers();
  adminMessages.innerHTML=messages.slice(-30).reverse().map(m=>'<div class="row"><span>'+escapeHtml(m.content)+'</span><button class="btn" onclick="deleteMessage(\''+m.id+'\')">حذف</button></div>').join("")||'<div class="notice">پیامی نیست.</div>';
}
async function setStudentWrite(id,canWrite){try{await api("set_student_write",{id,disabled:canWrite});await refreshAll()}catch(e){alert(e.message)}}
async function setGroupWrite(id,disabled){try{await api("set_group_write",{id,disabled:!disabled});await refreshAll()}catch(e){alert(e.message)}}
async function deleteMessage(id){try{await api("delete_message",{id});await refreshAll()}catch(e){alert(e.message)}}
async function logout(){token="";profile=null;localStorage.removeItem("helligram_token");app.style.display="none";login.style.display="block";nationalId.value="";staffCode.value="";staffPass.value="";setMode("student")}
async function restore(){
  if(!token)return;
  try{const d=await api("me");profile=d.profile;openApp()}catch{token="";localStorage.removeItem("helligram_token")}
}
let messagesEl=null,messagesBox=null;
restore();
setInterval(()=>{if(profile)refreshAll()},4000);
</script>
