<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حلی گرام | پیام رسان مدرسه</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#07101d;color:#edf5ff;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:rgba(15,29,48,.88);border:1px solid #263c59;border-radius:22px;box-shadow:0 18px 55px #0008;backdrop-filter:blur(15px)}button{font-family:inherit}.login{max-width:470px;margin:6vh auto;padding:30px}.brand{text-align:center}.logo{width:84px;height:84px;border-radius:24px;margin:auto auto 14px;display:grid;place-items:center;overflow:hidden;background:#07101d}.logo img{width:100%;height:100%;object-fit:contain}.muted{color:#9eb0c8}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0}.tabs button,.btn{border:0;border-radius:13px;padding:12px;cursor:pointer;font-weight:700;background:#16283f;color:#e8f2ff}.tabs button.active,.btn.primary{background:linear-gradient(135deg,#2f91ff,#795cff);color:white}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:7px;color:#c1cee0}input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid #2b4564;background:#091729;color:white;outline:none}select option{background:#0b1727}textarea{resize:vertical}.btn{width:100%;margin-top:9px}.error{color:#ff9ba5;min-height:22px;margin-top:8px}.app{display:none}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;margin-bottom:14px}.top h2{margin:0}.top .btn{width:auto;margin:0}.grid{display:grid;grid-template-columns:260px 1fr;gap:14px}.side{padding:14px}.side .btn{margin:5px 0}.chat{min-height:650px;display:flex;flex-direction:column}.chathead{padding:17px;border-bottom:1px solid #263c59}.messages{flex:1;padding:18px;overflow:auto;min-height:450px;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;padding:11px 14px;border-radius:16px;background:#172b45;align-self:flex-start;word-break:break-word}.msg.me{align-self:flex-end;background:#315fa8}.msg .sender-name{display:block;font-size:12px;color:#d9e8ff;margin-bottom:6px}.msg small{display:block;color:#9db1c9;font-size:10px;margin-top:5px}.composer{display:flex;gap:8px;padding:13px;border-top:1px solid #263c59}.composer textarea{min-height:50px;max-height:140px}.composer .btn{width:105px;margin:0}.notice{padding:11px;border-radius:12px;background:#10243c;margin-bottom:10px;font-size:13px}.admin{margin-top:14px;padding:18px;display:none}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{max-height:250px;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #20344e}.row .btn{width:auto;margin:0;padding:8px 10px;font-size:12px}.hidden{display:none!important}.status{font-size:11px;margin-top:5px}.version{text-align:center;color:#566b84;font-size:10px;margin-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{order:2}.chat{min-height:540px}.messages{min-height:350px}.adminGrid{grid-template-columns:1fr}.msg{max-width:92%}.wrap{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="card login">
  <div class="brand"><div class="logo"><img src="logo.png" alt="لوگوی حلی گرام"></div><h1>حلی گرام</h1><p class="muted">پیام رسان مدرسه</p></div>
  <div class="tabs"><button id="studentTab" class="active" onclick="setMode('student')">دانش آموز</button><button id="staffTab" onclick="setMode('staff')">مسئولین</button></div>
  <div id="studentForm"><div class="field"><label>کد ملی</label><input id="nationalId" inputmode="numeric" maxlength="10" placeholder="کد ملی را وارد کنید"></div><button class="btn primary" onclick="loginStudent()">ورود به حلی گرام</button></div>
  <div id="staffForm" class="hidden"><div class="field"><label>کد ورود مسئول</label><input id="staffCode" placeholder="کد اختصاصی مسئول"></div><div class="field"><label>رمز عبور</label><input id="staffPass" type="password" placeholder="رمز مسئولین"></div><button class="btn primary" onclick="loginStaff()">ورود مسئول</button></div>
  <div id="error" class="error"></div>
  <p class="muted" style="font-size:12px;text-align:center">اطلاعات واقعی دانش آموزان و مسئولین بعدا از طریق پایگاه داده وارد می شود.</p>
  <div class="version">v0.3.2</div>
</section>

<section id="app" class="app">
  <div class="card top"><div><h2>حلی گرام</h2><small id="who" class="muted"></small></div><button class="btn" onclick="logout()">خروج</button></div>
  <div class="grid">
    <aside class="card side">
      <div class="notice" id="roleNotice"></div>
      <button class="btn primary" onclick="showChat()">💬 پیام رسان</button>
      <button class="btn" id="adminBtn" onclick="toggleAdmin()">🛡️ پنل مدیریت</button>
      <button class="btn" onclick="refreshAll()">🔄 بروزرسانی</button>
    </aside>
    <main class="card chat">
      <div class="chathead"><b>پیام ها</b><div class="muted" id="chatStatus">پیام های شما</div></div>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="messageInput" placeholder="پیام خود را بنویسید..." maxlength="5000"></textarea>
        <button id="sendBtn" class="btn primary" onclick="sendMessage()">ارسال</button>
      </div>
    </main>
  </div>

  <section id="adminPanel" class="card admin">
    <h3>پنل مدیریت</h3>
    <div class="adminGrid">
      <div>
        <h4>کنترل دانش آموزان</h4>
        <div id="studentList" class="list"></div>
      </div>
      <div>
        <h4>کنترل گروه ها</h4>
        <div id="groupList" class="list"></div>
      </div>
    </div>
    <h4>پیام های اخیر</h4>
    <div id="adminMessages" class="list"></div>
  </section>
  <div class="version">v0.3.2</div>
</section>
</div>

<script>
const SUPABASE_URL="https://pwwicgyrycaexjnnhseb.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3d2ljZ3lyeWNhZXhqbm5oc2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzczMjgsImV4cCI6MjEwNjYxMzMyOH0.860RskDmycONZUHyOloN8AmKqRkzU5YNXUUze2DuPdM";
const API=SUPABASE_URL+"/functions/v1/helligram-api";
let token=localStorage.getItem("helligram_token")||"";
let profile=null;
let mode="student";
let groups=[];
let students=[];
let messages=[];
let sendTarget={staff:null,student:null,group:null};

async function api(action,body={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  let r;
  try{r=await fetch(API,{signal:controller.signal,method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,...(token?{"x-helligram-token":token}:{})},body:JSON.stringify({action,...body})});}catch(e){throw new Error(e.name==="AbortError"?"پاسخ سرور بیش از ۱۰ ثانیه طول کشید. اتصال Supabase را بررسی کنید.":e.message)}finally{clearTimeout(timer)}
  let data={};try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data.error||"خطا در ارتباط با سرور");
  return data;
}
function setMode(m){mode=m;studentForm.classList.toggle("hidden",m!=="student");staffForm.classList.toggle("hidden",m!=="staff");studentTab.classList.toggle("active",m==="student");staffTab.classList.toggle("active",m==="staff");error.textContent=""}
function busy(text){error.textContent=text}
async function loginStudent(){
  const rawId=nationalId.value.trim(); const id=rawId.replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776)).replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632)); if(!/^\d{10}$/.test(id)) return busy("کد ملی باید ۱۰ رقم باشد.");
  busy("در حال ورود...");
  try{const d=await api("login",{type:"student",national_id:id}); token=d.token;profile=d.profile;localStorage.setItem("helligram_token",token);openApp()}catch(e){busy(e.message)}
}
async function loginStaff(){
  const code=staffCode.value.trim(),pass=staffPass.value;
  if(!code||!pass)return busy("کد ورود و رمز عبور را وارد کنید.");
  busy("در حال ورود...");
  try{const d=await api("login",{type:"staff",login_code:code,password:pass});token=d.token;profile=d.profile;localStorage.setItem("helligram_token",token);openApp()}catch(e){busy(e.message)}
}
function openApp(){
  login.style.display="none";app.style.display="block";who.textContent=profile.name+(profile.className?" | "+profile.className:"");
  roleNotice.textContent=profile.type==="staff"?"ورود مسئول فعال است.":"دانش آموز | وضعیت ارسال: "+(profile.canWrite?"فعال":"بسته");
  adminBtn.classList.toggle("hidden",profile.type!=="staff");
  showChat();refreshAll();
}
async function refreshAll(){
  try{
    const m=await api("messages");
    messages=m.messages||[];
    renderMessages();
    if(profile?.type==="staff"){
      const g=await api("groups");
      groups=g.groups||[];
      const s=await api("students");
      students=s.students||[];
      renderAdmin();
    }
  }catch(e){
    chatStatus.textContent=e.message;
  }
}
function showChat(){adminPanel.style.display="none";chatStatus.textContent="پیام های شما";renderMessages()}
function renderMessages(){
  const el=document.getElementById("messages");
  if(!messages.length){
    el.innerHTML='<div class="notice">هنوز پیامی وجود ندارد.</div>';
    return;
  }
  el.innerHTML=messages.map(m=>{
    const mine=profile.type==="student"
      ? m.sender_student_id===profile.id
      : m.sender_staff_id===profile.id;
    return '<div class="msg '+(mine?"me":"")+'"><strong class="sender-name">'+escapeHtml(m.sender_name||"کاربر")+'</strong><div>'+escapeHtml(m.content)+'</div>'+
      '<small>'+new Date(m.created_at).toLocaleString("fa-IR")+'</small></div>';
  }).join("");
  el.scrollTop=el.scrollHeight;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function sendMessage(){
  const input=document.getElementById("messageInput");
  const btn=document.getElementById("sendBtn");
  const content=input.value.trim();
  if(!content)return;
  if(profile.type==="student"&&!profile.canWrite){
    alert("ارسال پیام برای شما بسته شده است.");
    return;
  }

  btn.disabled=true;
  btn.textContent="...";
  try{
    const body={content};
    if(profile.type==="student"){
      if(profile.defaultStaffId) body.recipient_staff_id=profile.defaultStaffId;
    }else if(students.length){
      body.recipient_student_id=students[0].id;
    }
    await api("send",body);
    input.value="";
    await refreshAll();
  }catch(e){
    alert(e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="ارسال";
  }
}
function toggleAdmin(){adminPanel.style.display=adminPanel.style.display==="none"?"block":"none";if(adminPanel.style.display==="block")renderAdmin()}
function renderAdmin(){
  studentList.innerHTML=students.map(s=>'<div class="row"><span>'+escapeHtml(s.full_name)+'<br><small class="muted">'+escapeHtml(s.class_name||"")+'</small></span><button class="btn" onclick="setStudentWrite(\''+s.id+'\','+s.can_write+')">'+(s.can_write?"بستن ارسال":"باز کردن ارسال")+'</button></div>').join("")||'<div class="notice">دانش آموزی ثبت نشده است.</div>';
  groupList.innerHTML=groups.map(g=>'<div class="row"><span>'+escapeHtml(g.name)+'</span><button class="btn" onclick="setGroupWrite(\''+g.id+'\','+g.write_disabled+')">'+(g.write_disabled?"باز کردن گروه":"بستن گروه")+'</button></div>').join("")||'<div class="notice">گروهی ثبت نشده است.</div>';
  adminMessages.innerHTML=messages.slice(-30).reverse().map(m=>'<div class="row"><span>'+escapeHtml(m.content)+'</span><button class="btn" onclick="deleteMessage(\''+m.id+'\')">حذف</button></div>').join("")||'<div class="notice">پیامی نیست.</div>';
}
async function setStudentWrite(id,canWrite){try{await api("set_student_write",{id,disabled:canWrite});await refreshAll()}catch(e){alert(e.message)}}
async function setGroupWrite(id,disabled){try{await api("set_group_write",{id,disabled:!disabled});await refreshAll()}catch(e){alert(e.message)}}
async function deleteMessage(id){try{await api("delete_message",{id});await refreshAll()}catch(e){alert(e.message)}}
async function logout(){token="";profile=null;localStorage.removeItem("helligram_token");app.style.display="none";login.style.display="block";nationalId.value="";staffCode.value="";staffPass.value="";setMode("student")}
async function restore(){
  if(!token)return;
  try{const d=await api("me");profile=d.profile;openApp()}catch{token="";localStorage.removeItem("helligram_token")}
}
let messagesEl=null,messagesBox=null;
restore();
setInterval(()=>{if(profile)refreshAll()},4000);
</script>
</body>
</html>
