async function api(action,body={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  let r;
  try{r=await fetch(API,{signal:controller.signal,method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,...(token?{"x-helligram-token":token}:{})},body:JSON.stringify({action,...body})});}catch(e){throw new Error(e.name==="AbortError"?"پاسخ سرور بیش از ۱۰ ثانیه طول کشید. اتصال Supabase را بررسی کنید.":e.message)}finally{clearTimeout(timer)}
  let data={};try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data.error||"خطا در ارتباط با سرور");
  return data;

function resizeAvatar(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=512,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/webp",.82));
      };
      img.onerror=()=>reject(new Error("خواندن عکس انجام نشد."));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("خواندن فایل انجام نشد."));
    reader.readAsDataURL(file);
  });
}

function chatKey(m){
  if(m.group_id)return "group:"+m.group_id;
  if(profile.type==="student"){
    if(m.recipient_student_id===profile.id)return "student:"+m.sender_student_id;
    if(m.sender_student_id===profile.id&&m.recipient_student_id)return "student:"+m.recipient_student_id;
    if(m.recipient_staff_id===profile.id)return "staff:"+m.sender_staff_id;
    if(m.sender_student_id===profile.id&&m.recipient_staff_id)return "staff:"+m.recipient_staff_id;
  }else{
    if(m.sender_staff_id===profile.id&&m.recipient_student_id)return "student:"+m.recipient_student_id;
    if(m.recipient_staff_id===profile.id&&m.sender_staff_id)return "staff:"+m.sender_staff_id;
    if(m.sender_staff_id!==profile.id&&m.sender_staff_id)return "staff:"+m.sender_staff_id;
    if(m.sender_student_id)return "student:"+m.sender_student_id;
  }
  return null;
}
function chatMeta(key){
  const [kind,id]=String(key).split(":");
  if(kind==="group"){
    const g=groups.find(x=>x.id===id);
    return {kind,id,name:g?.name||"گروه",icon:"👥",avatarUrl:g?.avatar_url||"",memberCount:g?.member_count||0,writeDisabled:!!g?.write_disabled};
  }
  if(kind==="student"){
    const x=students.find(x=>x.id===id);
    return {kind,id,name:x?.full_name||"دانش آموز",icon:"🎓",avatarUrl:x?.avatar_url||""};
  }
  const x=staff.find(x=>x.id===id);
  return {kind,id,name:x?.full_name||"مسئول",icon:"👤",avatarUrl:x?.avatar_url||""};
}

async function deleteSelectedGroup(){
  const groupId=document.getElementById("manageGroupSelect").value;
  if(!groupId)return alert("ابتدا یک گروه را انتخاب کنید.");
  const group=groups.find(x=>x.id===groupId);
  if(!group)return;
  if(!confirm("گروه «"+group.name+"» حذف شود؟"))return;
  try{
    await api("delete_group",{group_id:groupId});
    selectedChat=null;
    await refreshAll();
    alert("گروه حذف شد.");
  }catch(e){alert(e.message)}
}
function notifyKey(){return "helligram_notification_ids_"+(profile?.type||"guest")+"_"+(profile?.id||"guest")}
function loadKnownMessageIds(){
  try{return new Set(JSON.parse(localStorage.getItem(notifyKey())||"[]"))}catch{return new Set()}
}
function saveKnownMessageIds(ids){
  const arr=[...ids].slice(-300);
  localStorage.setItem(notifyKey(),JSON.stringify(arr));
}
async function enableNotifications(){
  if(!("Notification" in window)){alert("مرورگر شما اعلان های وب را پشتیبانی نمی کند.");return}
  try{
    const permission=await Notification.requestPermission();
    if(permission==="granted"){
      notificationsReady=true;
      localStorage.setItem("helligram_notifications","1");
      updateNotificationButton();
      new Notification("حــلــی‌گــــرام",{body:"اعلان پیام های جدید فعال شد."});
    }else{
      notificationsReady=false;
      updateNotificationButton();
      alert("اجازه اعلان داده نشد. از تنظیمات مرورگر، اعلان های این سایت را فعال کنید.");
    }
  }catch(e){alert("فعال سازی اعلان انجام نشد.")}
}
function updateNotificationButton(){
  const b=document.getElementById("notifyBtn");
  if(!b)return;
  if(!("Notification" in window)){b.textContent="🔕 اعلان پشتیبانی نمی شود";b.disabled=true;return}
  if(Notification.permission==="granted"||notificationsReady){
    b.textContent="🔔 اعلان پیام فعال است";
    b.classList.add("primary");
  }else if(Notification.permission==="denied"){
    b.textContent="🔕 اعلان مسدود شده";
  }else b.textContent="🔔 فعال سازی اعلان پیام";
}
function processIncomingNotifications(){
  if(!profile)return;
  const current=loadKnownMessageIds();
  if(!notificationInitialized){
    messages.forEach(m=>current.add(m.id));
    saveKnownMessageIds(current);
    knownMessageIds=current;
    notificationInitialized=true;
    notificationsReady=localStorage.getItem("helligram_notifications")==="1"&&("Notification" in window)&&Notification.permission==="granted";
    updateNotificationButton();
    return;
  }
  const fresh=messages.filter(m=>m?.id&&!current.has(m.id)&&!isOwnMessage(m));
  fresh.forEach(m=>{
    current.add(m.id);
    if(notificationsReady&&document.visibilityState!=="visible"){
      const key=chatKey(m);
      const meta=chatMeta(key);
      try{
        new Notification("پیام جدید در حــلــی‌گــــرام",{body:(m.sender_name?m.sender_name+" : ":"")+String(m.content||"").slice(0,120),tag:"helligram-"+key});
      }catch{}
    }
  });
  saveKnownMessageIds(current);
  knownMessageIds=current;
}
function renderMessages(){renderChatList();updateUnreadIndicator();processIncomingNotifications();if(selectedChat){renderConversation();renderPinnedHeader()}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
let callSocket=null,callSocketRef=1,callHeartbeat=null,callMyTopic="",callStartedAt=0,activeCall=null,callPeer=null,callLocalStream=null,callMuted=false,callIceQueue=[];
function callTopic(type,id){return "realtime:helligram-call-"+type+"-"+id;}
function callSend(topic,payload){
  if(!callSocket||callSocket.readyState!==WebSocket.OPEN)return false;
  const ref=String(callSocketRef++);
  callSocket.send(JSON.stringify({topic:topic,event:"broadcast",payload:{type:"broadcast",event:"helligram-call",payload},ref}));
  return true;
}
function connectCallSocket(){
  if(!profile)return;
  if(callSocket){try{callSocket.close()}catch{}}
  callMyTopic=callTopic(profile.type,profile.id);
  const url=SUPABASE_URL+"/realtime/v1/websocket?apikey="+encodeURIComponent(SUPABASE_KEY)+"&vsn=1.0.0";
  callSocket=new WebSocket(url);
  callSocket.onopen=()=>{
    const ref=String(callSocketRef++);
    callSocket.send(JSON.stringify({topic:callMyTopic,event:"phx_join",payload:{config:{broadcast:{ack:false,self:false},presence:{enabled:false},private:false}},ref,join_ref:ref}));
    if(callHeartbeat)clearInterval(callHeartbeat);
    callHeartbeat=setInterval(()=>{if(callSocket?.readyState===WebSocket.OPEN)callSocket.send(JSON.stringify({topic:"phoenix",event:"heartbeat",payload:{},ref:String(callSocketRef++)}))},20000);
  };
  callSocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="broadcast"&&m.payload?.payload)handleCallSignal(m.payload.payload)}catch{}};
  callSocket.onclose=()=>{if(callHeartbeat)clearInterval(callHeartbeat);if(profile&&!activeCall)setTimeout(connectCallSocket,2500)};
}
function sendCallSignal(peerType,peerId,data){return callSend(callTopic(peerType,peerId),{...data,to_type:peerType,to_id:peerId,from_type:profile.type,from_id:profile.id});}
async function handleCallSignal(data){
  if(!profile||data.to_type!==profile.type||data.to_id!==profile.id)return;
  if(data.kind==="invite"){
    if(activeCall)return;
    activeCall={id:data.call_id,peerType:data.from_type,peerId:data.from_id,role:"callee"};
    const meta=callPeerMeta({type:data.from_type,id:data.from_id});
    document.getElementById("callName").textContent=meta.name;
    document.getElementById("callState").textContent="تماس صوتی ورودی";
    callAvatar(meta);resetCallUi();
    document.getElementById("callAcceptBtn")?.classList.remove("hidden");
    callUi(true);
    activeCall.offer=data.offer;
    return;
  }
  if(!activeCall||data.call_id!==activeCall.id)return;
  if(data.kind==="answer"&&callPeer){
    await callPeer.setRemoteDescription(data.answer).catch(()=>{});
    document.getElementById("callState").textContent="در حال اتصال...";
  }
  if(data.kind==="ice"){if(callPeer?.remoteDescription)await callPeer.addIceCandidate(data.candidate).catch(()=>{});else callIceQueue.push(data.candidate);}
  if(data.kind==="end"){await finishCallUi();}
}
function callPeerMeta(ref){
  const a=ref?.type==="student"?students.find(x=>x.id===ref.id):staff.find(x=>x.id===ref.id);
  return {name:a?.full_name||(ref?.type==="student"?"دانش آموز":"مسئول"),avatarUrl:a?.avatar_url||null};
}
function updateCallButton(){const b=document.getElementById("callBtn");if(!b)return;const m=selectedChat?chatMeta(selectedChat):null;b.classList.toggle("hidden",!(profile&&m&&m.kind!=="group"&&m.id));}
function callUi(show){document.getElementById("callOverlay")?.classList.toggle("show",show);}
function callAvatar(m){const e=document.getElementById("callAvatar");if(e)e.innerHTML=m?.avatarUrl?'<img src="'+escapeHtml(m.avatarUrl)+'" alt="">':escapeHtml((m?.name||"؟").slice(0,1));}
function closeCallMedia(){if(callPeer){try{callPeer.close()}catch{};callPeer=null}if(callLocalStream){callLocalStream.getTracks().forEach(t=>t.stop());callLocalStream=null}const a=document.getElementById("remoteAudio");if(a)a.srcObject=null}
function resetCallUi(){document.getElementById("callAcceptBtn")?.classList.add("hidden");document.getElementById("callMuteBtn")?.classList.add("hidden");document.getElementById("callTimer").textContent="";callMuted=false}
async function prepareCallPeer(){
  if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)throw new Error("مرورگر شما از تماس صوتی پشتیبانی نمی کند.");
  callPeer=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  callPeer.onicecandidate=e=>{if(e.candidate&&activeCall)sendCallSignal(activeCall.peerType,activeCall.peerId,{kind:"ice",call_id:activeCall.id,candidate:e.candidate.toJSON()})};
  callPeer.ontrack=e=>{const a=document.getElementById("remoteAudio");if(a&&e.streams[0]){a.srcObject=e.streams[0];a.play().catch(()=>{})}};
  callPeer.onconnectionstatechange=()=>{if(callPeer&&["failed","closed"].includes(callPeer.connectionState))finishCallUi()};
  callLocalStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  callLocalStream.getTracks().forEach(t=>callPeer.addTrack(t,callLocalStream));
}
async async function startVoiceCall(){
  if(!selectedChat||activeCall)return;
  const m=chatMeta(selectedChat);if(m.kind==="group"||!m.id)return;
  if(!callSocket||callSocket.readyState!==WebSocket.OPEN){alert("اتصال تماس آماده نیست. یک لحظه صبر کنید.");connectCallSocket();return}
  try{
    activeCall={id:crypto.randomUUID(),peerType:m.kind,peerId:m.id,role:"caller"};
    const pm=callPeerMeta({type:m.kind,id:m.id});
    document.getElementById("callName").textContent=pm.name;document.getElementById("callState").textContent="در حال تماس...";
    callAvatar(pm);resetCallUi();document.getElementById("callMuteBtn")?.classList.remove("hidden");callUi(true);
    await prepareCallPeer();
    const offer=await callPeer.createOffer();await callPeer.setLocalDescription(offer);
    if(!sendCallSignal(m.kind,m.id,{kind:"invite",call_id:activeCall.id,offer:callPeer.localDescription})){throw new Error("اتصال تماس به سرور برقرار نیست.");}
  }catch(e){finishCallUi();alert(e.message||"برقراری تماس انجام نشد.")}
}
async function acceptIncomingCall(){
  if(!activeCall||activeCall.role!=="callee")return;
  try{
    await prepareCallPeer();
    await callPeer.setRemoteDescription(activeCall.offer);
    for(const c of callIceQueue){await callPeer.addIceCandidate(c).catch(()=>{});}callIceQueue=[];
    const answer=await callPeer.createAnswer();await callPeer.setLocalDescription(answer);
    sendCallSignal(activeCall.peerType,activeCall.peerId,{kind:"answer",call_id:activeCall.id,answer:callPeer.localDescription});
    document.getElementById("callState").textContent="در حال اتصال...";
    document.getElementById("callAcceptBtn")?.classList.add("hidden");document.getElementById("callMuteBtn")?.classList.remove("hidden");
  }catch(e){alert(e.message||"پذیرش تماس انجام نشد.");finishCallUi()}
}
function rejectOrHangupCall(){
  if(activeCall)sendCallSignal(activeCall.peerType,activeCall.peerId,{kind:"end",call_id:activeCall.id});
  finishCallUi();
}
function finishCallUi(){
  closeCallMedia();activeCall=null;callUi(false);resetCallUi();
}
function toggleCallMute(){
  if(!callLocalStream)return;
  callMuted=!callMuted;callLocalStream.getAudioTracks().forEach(t=>t.enabled=!callMuted);
  const b=document.getElementById("callMuteBtn");if(b)b.textContent=callMuted?"🔇":"🎙️";
}
function updateCallTimer(){
  if(!activeCall||!callPeer||callPeer.connectionState!=="connected")return;
  if(!callStartedAt)callStartedAt=Date.now();
  const n=Math.floor((Date.now()-callStartedAt)/1000),m=String(Math.floor(n/60)).padStart(2,"0"),s=String(n%60).padStart(2,"0");
  const e=document.getElementById("callTimer");if(e)e.textContent=m+":"+s;
}

async function sendMessage(){
  const input=document.getElementById("messageInput");
  const btn=document.getElementById("sendBtn");
  const content=input.value.trim();
  if(!content)return;
  if(profile.type==="student"&&!profile.canWrite){
    alert("ارسال پیام برای شما بسته شده است.");
    return;
  }

  btn.disabled=true;
  btn.textContent="...";
  try{
    const body={content};
    if(!sendTarget.id) return alert("ابتدا مقصد پیام را انتخاب کنید.");
    if(sendTarget.kind==="staff") body.recipient_staff_id=sendTarget.id;
    if(sendTarget.kind==="student") body.recipient_student_id=sendTarget.id;
    if(sendTarget.kind==="group") body.group_id=sendTarget.id;
    await api("send",body);
    input.value="";
    if(sendTarget.id) selectedChat=sendTarget.kind+":"+sendTarget.id;
    await refreshAll();
    openChat(selectedChat);
  }catch(e){
    alert(e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="ارسال";
  }
}
function toggleAdmin(){adminPanel.style.display=adminPanel.style.display==="none"?"block":"none";if(adminPanel.style.display==="block")renderAdmin()}
function renderAdmin(){
  studentList.innerHTML=students.map(s=>'<div class="row"><span>'+escapeHtml(s.full_name)+'<br><small class="muted">'+escapeHtml(s.class_name||"")+'</small></span><button class="btn" onclick="setStudentWrite(\''+s.id+'\','+s.can_write+')">'+(s.can_write?"بستن ارسال":"باز کردن ارسال")+'</button></div>').join("")||'<div class="notice">دانش آموزی ثبت نشده است.</div>';
  groupList.innerHTML=groups.map(g=>'<div class="row"><div style="display:flex;align-items:center;gap:8px;min-width:0"><div class="groupAvatarPreview">'+(g.avatar_url?'<img src="'+escapeHtml(g.avatar_url)+'" alt="">':'👥')+'</div><span>'+escapeHtml(g.name)+'</span></div><div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><input id="groupAvatarInput_'+g.id+'" class="groupAvatarInput" type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadGroupAvatar(\''+g.id+'\',this)"><button class="btn groupAvatarBtn" onclick="document.getElementById(\'groupAvatarInput_'+g.id+'\').click()" type="button">📷 عکس</button><button class="btn" onclick="setGroupWrite(\''+g.id+'\','+g.write_disabled+')">'+(g.write_disabled?"باز کردن گروه":"بستن گروه")+'</button></div></div>').join("")||'<div class="notice">گروهی ثبت نشده است.</div>';
  const gs=document.getElementById("manageGroupSelect");
  const ss=document.getElementById("manageStudentSelect");
  if(gs){gs.innerHTML=groups.map(g=>'<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>').join("")||'<option value="">گروهی نیست</option>';}
  if(ss){ss.innerHTML=students.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.full_name)+'</option>').join("")||'<option value="">دانش آموزی نیست</option>';}
  if(groups.length&&students.length)loadGroupMembers();
  adminMessages.innerHTML=messages.slice(-30).reverse().map(m=>'<div class="row"><span>'+escapeHtml(m.content)+'</span><button class="btn" onclick="deleteMessage(\''+m.id+'\')">حذف</button></div>').join("")||'<div class="notice">پیامی نیست.</div>';
}
async function setStudentWrite(id,canWrite){try{await api("set_student_write",{id,disabled:canWrite});await refreshAll()}catch(e){alert(e.message)}}
async function setGroupWrite(id,disabled){try{await api("set_group_write",{id,disabled:!disabled});await refreshAll()}catch(e){alert(e.message)}}
async function deleteMessage(id){try{await api("delete_message",{id});await refreshAll()}catch(e){alert(e.message)}}
async function pinMessage(messageId){try{await api("pin_message",{message_id:messageId});await refreshAll();if(selectedChat){renderConversation();renderPinnedHeader()}}catch(e){alert(e.message)}}
async function unpinMessage(messageId){try{await api("unpin_message",{message_id:messageId});await refreshAll();if(selectedChat){renderConversation();renderPinnedHeader()}}catch(e){alert(e.message)}}
async function logout(){token="";profile=null;localStorage.removeItem("helligram_token");$("app").style.display="none";$("login").style.display="block";$("nationalId").value="";$("staffCode").value="";$("staffPass").value="";setMode("student")}
async function restore(){
  if(!token)return;
  try{const d=await api("me");profile=d.profile;openApp()}catch{token="";localStorage.removeItem("helligram_token")}
}
let messagesEl=null,messagesBox=null;
updateNotificationButton();
setInterval(updateCallTimer,1000);
restore();
setInterval(()=>{if(profile)refreshAll()},4000);
</script>
