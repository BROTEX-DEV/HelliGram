<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حلی گرام | پیام رسان مدرسه</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#08111f;color:#eef5ff;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:rgba(18,31,51,.82);border:1px solid #263a58;border-radius:24px;box-shadow:0 20px 60px #0006;backdrop-filter:blur(16px)}.login{max-width:460px;margin:7vh auto;padding:32px}.brand{text-align:center}.logo{width:82px;height:82px;border-radius:24px;margin:auto auto 14px;background:linear-gradient(135deg,#37a5ff,#7c5cff);display:grid;place-items:center;font-size:34px;font-weight:900}.muted{color:#9eb0c8}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0}.tabs button,.btn{border:0;border-radius:14px;padding:13px;cursor:pointer;font-weight:700;background:#16263e;color:#dceaff}.tabs button.active,.btn.primary{background:linear-gradient(135deg,#318fff,#7a5cff);color:white}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:7px;color:#b9c9dd}input,textarea,select{width:100%;padding:13px;border-radius:13px;border:1px solid #2b4261;background:#0b182a;color:white;outline:none}textarea{resize:vertical}.btn{width:100%;margin-top:10px}.error{color:#ff8f9b;min-height:20px;margin-top:8px}.app{display:none}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:16px}.top h2{margin:0}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.side{padding:16px}.side button{width:100%;margin:5px 0}.chat{min-height:600px;display:flex;flex-direction:column}.chathead{padding:18px;border-bottom:1px solid #263a58}.messages{flex:1;padding:18px;overflow:auto}.msg{max-width:75%;padding:11px 14px;border-radius:16px;margin:8px 0;background:#172942}.msg.me{margin-right:auto;background:#305ba8}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid #263a58}.composer textarea{min-height:48px}.composer .btn{width:110px;margin:0}.notice{padding:12px;border-radius:13px;background:#10233a;margin-bottom:10px;font-size:13px}.hidden{display:none!important}@media(max-width:750px){.grid{grid-template-columns:1fr}.side{order:2}.chat{min-height:520px}.wrap{padding:12px}.top{gap:10px}.msg{max-width:90%}}
</style></head>
<body>
<div class="wrap">
<section id="login" class="card login">
<div class="brand"><div class="logo">ح</div><h1>حلی گرام</h1><p class="muted">پیام رسان مدرسه</p></div>
<div class="tabs"><button id="studentTab" class="active" onclick="setMode('student')">دانش آموز</button><button id="staffTab" onclick="setMode('staff')">مسئولین</button></div>
<div id="studentForm"><div class="field"><label>کد ملی</label><input id="nationalId" inputmode="numeric" placeholder="کد ملی را وارد کنید"></div><button class="btn primary" onclick="loginStudent()">ورود به حلی گرام</button></div>
<div id="staffForm" class="hidden"><div class="field"><label>کد ورود مسئول</label><input id="staffCode" placeholder="کد اختصاصی مسئول"></div><div class="field"><label>رمز عبور</label><input id="staffPass" type="password" placeholder="رمز مسئولین"></div><button class="btn primary" onclick="loginStaff()">ورود مسئول</button></div>
<div id="error" class="error"></div>
<p class="muted" style="font-size:12px;text-align:center">نسخه آزمایشی اولیه — اطلاعات واقعی بعدا متصل می شود.</p>
</section>
<section id="app" class="app">
<div class="card top"><div><h2>حلی گرام</h2><small id="who" class="muted"></small></div><button class="btn" style="width:auto;margin:0" onclick="logout()">خروج</button></div>
<div class="grid"><aside class="card side"><div class="notice" id="roleNotice"></div><button class="btn primary" onclick="showDemoChat()">💬 پیام رسان</button><button class="btn" id="adminBtn" onclick="toggleAdmin()">🛡️ مدیریت</button></aside>
<main class="card chat"><div class="chathead"><b id="chatTitle">گفتگوی آزمایشی</b><div class="muted" id="chatStatus">آماده ارسال پیام</div></div><div id="messages" class="messages"></div><div class="composer"><textarea id="messageInput" placeholder="پیام خود را بنویسید..."></textarea><button class="btn primary" onclick="sendMessage()">ارسال</button></div></main></div>
<div id="adminPanel" class="card" style="margin-top:16px;padding:20px;display:none"><h3>پنل مسئول</h3><div class="notice">در نسخه واقعی، این بخش به Supabase متصل می شود و حذف پیام، بستن نوشتن فردی و گروهی و مدیریت کاربران از اینجا انجام می شود.</div><div class="grid" style="grid-template-columns:1fr 1fr"><div><label>دانش آموز</label><select><option>نمونه دانش آموز ۱</option><option>نمونه دانش آموز ۲</option></select><button class="btn" onclick="alert('مجوز نوشتن این کاربر در نسخه واقعی بسته می شود.')">🚫 بستن نوشتن</button></div><div><label>گروه</label><select><option>کلاس نمونه</option></select><button class="btn" onclick="alert('نوشتن گروه در نسخه واقعی بسته می شود.')">🚫 بستن نوشتن گروه</button></div></div></div>
</section></div>
<script>
const DEMO_STUDENTS={'1111111111':{name:'دانش آموز نمونه',className:'کلاس نمونه'}};
let mode='student',current=null,blocked=false;
function setMode(m){mode=m;studentForm.classList.toggle('hidden',m!=='student');staffForm.classList.toggle('hidden',m!=='staff');studentTab.classList.toggle('active',m==='student');staffTab.classList.toggle('active',m==='staff');error.textContent=''}
function loginStudent(){const id=nationalId.value.trim();if(!/^\d{10}$/.test(id))return error.textContent='کد ملی باید ۱۰ رقم باشد.';current={type:'student',...(DEMO_STUDENTS[id]||{name:'دانش آموز آزمایشی',className:'کلاس آزمایشی'})};openApp()}
function loginStaff(){if(!staffCode.value.trim()||staffPass.value!=='helli43helli42')return error.textContent='کد ورود یا رمز عبور نادرست است.';current={type:'staff',name:'مسئول آزمایشی'};openApp()}
function openApp(){login.style.display='none';app.style.display='block';who.textContent=current.name;roleNotice.textContent=current.type==='staff'?'ورود مسئول فعال است.':'ورود دانش آموز | '+(current.className||'');adminBtn.classList.toggle('hidden',current.type!=='staff');showDemoChat()}
function showDemoChat(){adminPanel.style.display='none';chatTitle.textContent=current.type==='staff'?'گفتگوی مدیریت':'گفتگوی آزمایشی';messages.innerHTML='<div class="msg">به حلی گرام خوش آمدید 👋</div><div class="msg">این نسخه اولیه برای آماده سازی ساختار پیام رسان است.</div>'}
function toggleAdmin(){adminPanel.style.display=adminPanel.style.display==='none'?'block':'none'}
function sendMessage(){const v=messageInput.value.trim();if(!v)return;if(blocked&&current.type==='student')return alert('ارسال پیام برای شما بسته شده است.');const d=document.createElement('div');d.className='msg me';d.textContent=v;messages.appendChild(d);messageInput.value='';messages.scrollTop=messages.scrollHeight}
function logout(){current=null;app.style.display='none';login.style.display='block';nationalId.value='';staffCode.value='';staffPass.value='';error.textContent='';setMode('student')}
</script></body></html>
