<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10">
<title>حلی سینما</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'CinemaBody';src:url('./2.ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
@font-face{font-family:'CinemaHead';src:url('./1.ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--bg:#000000;--panel:#000000;--line:#202020;--text:#f4f4f4;--muted:#929292;--accent:#bdbdbd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#000000;color:var(--text);font-family:'CinemaBody',Tahoma,sans-serif;animation:page-in .55s ease both;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 8%,#ffffff19 0,transparent 34%),radial-gradient(ellipse at 12% 55%,#bfc8d51a 0,transparent 28%),radial-gradient(ellipse at 88% 72%,#ffffff12 0,transparent 30%);animation:ambient-drift 9s ease-in-out infinite alternate}
@keyframes page-in{from{opacity:0}to{opacity:1}}
@keyframes ambient-drift{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,-1%,0) scale(1.08)}}
@keyframes hero-flash{0%{opacity:0;transform:scaleX(.1)}25%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes logo-pulse{0%,100%{box-shadow:0 0 0 0 #ffffff08,0 0 18px #ffffff10}50%{box-shadow:0 0 0 5px #ffffff0a,0 0 32px #ffffff30}}
@keyframes logo-shine{0%,45%{transform:translateX(180%) rotate(25deg);opacity:0}55%{opacity:1}80%,100%{transform:translateX(-220%) rotate(25deg);opacity:0}}
@keyframes spotlight{0%,100%{box-shadow:0 12px 32px #ffffff10,0 0 18px #ffffff05}50%{box-shadow:0 18px 48px #ffffff20,0 0 38px #ffffff12}}
@keyframes poster-arrive{0%{opacity:0;transform:translateY(70px) scale(.88) rotateX(10deg);filter:blur(8px)}70%{opacity:1;transform:translateY(-7px) scale(1.015);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes scan-sheen{0%,100%{background-position:200% 0}50%{background-position:-200% 0}}
@keyframes rise-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes logo-shine{0%,65%{transform:translateX(160%) rotate(25deg);opacity:0}75%{opacity:.8}100%{transform:translateX(-160%) rotate(25deg);opacity:0}}
@keyframes soft-glow{0%,100%{box-shadow:0 8px 24px #ffffff0a,0 0 0 1px #ffffff05}50%{box-shadow:0 8px 26px #ffffff10,0 0 22px #ffffff08}}
.shell{width:min(1440px,100%);margin:auto;padding:0 clamp(22px,4vw,64px)}header{height:80px;display:flex;align-items:center;border-bottom:1px solid #ffffff12;font-size:15px;font-weight:700;gap:8px}
.brand-mark{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;margin-left:2px;padding:4px;overflow:hidden;background:#080808;border:1px solid #292929;border-radius:11px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 1px #ffffff18,0 5px 18px #ffffff12}.brand-mark{position:relative;animation:logo-pulse 2.4s ease-in-out infinite}
.brand-mark:after{content:"";position:absolute;top:-35%;bottom:-35%;left:0;width:34%;background:linear-gradient(90deg,transparent,#ffffffb8,transparent);transform:translateX(160%) rotate(25deg);pointer-events:none;animation:logo-shine 2.7s ease-in-out .4s infinite}
.brand-mark img{display:block;width:100%;height:100%;object-fit:contain;border-radius:7px;position:relative;z-index:1}
.hero{position:relative;padding:clamp(38px,5vw,64px) 0 36px;animation:rise-in .75s .12s both}.hero:after{content:"";display:block;width:min(340px,65%);height:2px;margin-top:22px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 16px #ffffff70;transform-origin:right;animation:hero-flash 1.2s .4s both}.eyebrow{display:inline-block;color:#d0d0d0;font-size:11px;padding:5px 10px;border:1px solid #292929;border-radius:999px;background:#050505;margin-bottom:12px}
h1{font-size:clamp(32px,3.2vw,46px);font-weight:800;letter-spacing:-.6px;margin:0 0 7px;text-shadow:none}.subtitle{font-size:13px;color:var(--muted);margin:0}
.playlist-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.playlist-head h2{font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px}.playlist-head h2:before{content:"";width:3px;height:17px;background:var(--accent);border-radius:3px;box-shadow:0 0 12px #82b5ff55}
.day{font-size:11px;color:#b5c0d2;padding:5px 9px;background:#080808;border:1px solid #242424;border-radius:7px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.2vw,32px)}.card{min-width:0;padding:clamp(10px,1.2vw,16px) clamp(10px,1.2vw,16px) 18px;background:#050505;border:1px solid #222222;border-radius:12px;box-shadow:0 8px 24px #ffffff0a,0 0 0 1px #ffffff05;transition:transform .32s cubic-bezier(.2,.9,.25,1.35),border-color .25s ease,box-shadow .25s ease;animation:poster-arrive .85s cubic-bezier(.2,.8,.2,1) both;animation-play-state:paused;animation-delay:calc(.3s + var(--i,0)*.22s);transform-origin:center bottom}
.card:hover{transform:translateY(-10px) scale(1.045) rotate(-.4deg);border-color:#eeeeee;box-shadow:0 22px 48px #ffffff24,0 0 34px #ffffff18}
.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#000000;border-radius:7px;transition:filter .35s ease,transform .35s ease;filter:contrast(1.02)}.card:hover .poster{filter:contrast(1.12) brightness(1.08);transform:scale(1.012)}.poster.playable{cursor:default}
.fallback{aspect-ratio:2/3;display:grid;place-items:center;text-align:center;padding:12px;background:#151923;color:#929caf;border-radius:7px;font-size:13px}
.title{font-size:clamp(14px,1.1vw,17px);font-weight:600;line-height:1.8;margin:12px 3px 0}
footer{margin-top:38px;border-top:1px solid #ffffff12;padding:16px 0 20px;text-align:center;color:#828da0;font-size:11px}.version{font-size:9px;color:#586579;margin-top:4px;letter-spacing:.3px}
.ad-slot{width:100%;margin:30px 0 0;display:flex;justify-content:center;align-items:center;min-height:0}
.ad-slot img{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}
.inline-player{display:block}
.player-box{width:100%;background:#000000;border:1px solid #444444;border-radius:14px;overflow:hidden;box-shadow:0 12px 32px #ffffff10,0 0 18px #ffffff05;margin-top:2cm;margin-bottom:18px;animation:rise-in .8s .24s both,spotlight 3.2s 1.2s ease-in-out infinite}
.player-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid #222222}.player-title{font-size:14px;font-weight:700;margin:0}
.close{border:0;border-radius:8px;background:#161616;color:#e8eef8;width:34px;height:34px;font-size:23px;cursor:pointer}
.player-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}.player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-note{font-size:11px;color:#8997ac;padding:10px 14px;margin:0}
.secret-overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:#000000e8;backdrop-filter:blur(10px);animation:page-in .2s ease both}.secret-overlay[hidden]{display:none}
.secret-room{position:relative;width:min(390px,100%);padding:30px 22px;text-align:center;background:#050505;border:1px solid #292929;border-radius:16px;box-shadow:0 24px 90px #000b,0 0 28px #ffffff0d;animation:rise-in .3s ease both}
.secret-stamp{width:64px;height:64px;margin:0 auto 17px;display:grid;place-items:center;border:1px solid #333333;border-radius:18px;font-size:27px;color:#eeeeee;background:#090909;box-shadow:inset 0 1px #ffffff15,0 8px 22px #0005}
.secret-room h2{font-size:21px;margin:0 0 8px}.secret-room p{font-size:13px;color:#aeb9ca;line-height:2;margin:0}
.secret-code{display:inline-block;margin-top:17px;padding:7px 11px;border:1px dashed #333333;border-radius:7px;color:#dddddd;font-size:11px;letter-spacing:1px;direction:ltr;background:#050505}
.secret-close{position:absolute;left:12px;top:10px;background:none;border:0;color:#aeb9ca;font:inherit;font-size:22px;cursor:pointer}
@media(min-width:1100px){.player-box{max-width:1120px;margin-left:auto;margin-right:auto}.player-head{padding:16px 20px}.player-title{font-size:16px}.playlist-head h2{font-size:17px}.day{font-size:12px}}
@media(max-width:900px){.shell{padding:0 20px}}
@media(max-width:600px){.shell{padding:0 13px}.hero{padding:28px 0 23px}.grid{gap:10px}.card{padding:6px 6px 9px}.title{font-size:12px;margin-top:8px}.overlay{padding:10px}.player-head{padding:9px 11px}}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Dramatic studio-style opening */
.cinema-intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:#000;isolation:isolate;cursor:pointer;animation:intro-blackout .55s ease both}
.cinema-intro[hidden]{display:none}
.cinema-intro:before,.cinema-intro:after{content:"";position:absolute;z-index:-1;top:-55%;width:48vw;height:145vh;opacity:0;filter:blur(5px);background:linear-gradient(180deg,transparent 0%,#ffffff05 24%,#ffffff55 49%,#ffffff0a 70%,transparent 100%);transform-origin:top center;mix-blend-mode:screen}
.cinema-intro:before{left:8%;transform:rotate(28deg);animation:beam-left 2.2s .15s ease-out both}
.cinema-intro:after{right:8%;transform:rotate(-28deg);animation:beam-right 2.2s .15s ease-out both}
.intro-glow{position:absolute;width:min(78vw,650px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffffff22 0, #ffffff0a 27%,transparent 68%);opacity:0;animation:glow-pop 1.4s .6s ease-out both}
.intro-content{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px;animation:studio-logo 1.25s .35s cubic-bezier(.16,1,.3,1) both}
.intro-logo{width:clamp(100px,18vw,170px);height:clamp(100px,18vw,170px);object-fit:contain;border-radius:50%;border:1px solid #ffffff55;padding:7px;background:#030303;box-shadow:inset 0 0 22px #ffffff10,0 0 0 5px #ffffff08;filter:drop-shadow(0 0 12px #ffffff65) drop-shadow(0 0 42px #ffffff45);animation:logo-throb 2s 1.5s ease-in-out infinite}
.intro-title{font-size:clamp(34px,7vw,68px);font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 0 10px #fff9,0 0 28px #ffffff90,0 0 65px #ffffff55;margin:0}
.intro-rule{width:min(360px,70vw);height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 20px #ffffffb0;animation:rule-grow 1.2s .85s ease both}
.intro-tagline{margin:0;color:#c7c7c7;font-size:clamp(10px,2vw,13px);letter-spacing:clamp(2px,.7vw,6px);animation:page-in .8s 1.15s both}
.cinema-intro.leaving{animation:intro-exit .85s cubic-bezier(.7,0,.3,1) both;pointer-events:none}
@keyframes intro-blackout{from{opacity:0}to{opacity:1}}
@keyframes beam-left{0%{opacity:0;transform:translateX(-18%) rotate(28deg) scaleX(.12)}40%{opacity:.9}100%{opacity:.22;transform:translateX(25%) rotate(28deg) scaleX(1.1)}}
@keyframes beam-right{0%{opacity:0;transform:translateX(18%) rotate(-28deg) scaleX(.12)}40%{opacity:.8}100%{opacity:.18;transform:translateX(-25%) rotate(-28deg) scaleX(1.1)}}
@keyframes glow-pop{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.05)}100%{opacity:.6;transform:scale(1)}}
@keyframes studio-logo{0%{opacity:0;transform:translateY(32px) scale(.72);filter:blur(14px)}65%{opacity:1;filter:blur(0);transform:translateY(-4px) scale(1.035)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes logo-throb{0%,100%{filter:drop-shadow(0 0 12px #ffffff65) drop-shadow(0 0 42px #ffffff45);transform:scale(1)}50%{filter:drop-shadow(0 0 22px #fff) drop-shadow(0 0 68px #ffffffb0);transform:scale(1.045)}}
@keyframes rule-grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes intro-exit{0%{opacity:1;transform:scale(1);filter:brightness(1)}35%{opacity:1;filter:brightness(2.4)}100%{opacity:0;transform:scale(1.08);filter:brightness(3)}}



/* Use the first custom font for headings and the second for regular text */
h1,h2,h3,.player-title,.intro-title,.secret-room h2{font-family:'CinemaHead','CinemaBody',Tahoma,sans-serif}

/* Scroll reveal: posters and lower sections animate as they enter the viewport */
.card.in-view{animation-play-state:running}
.scroll-reveal{opacity:0;transform:translateY(26px);filter:blur(5px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .7s ease}
.scroll-reveal.in-view{opacity:1;transform:translateY(0);filter:blur(0)}

</style>
</head>
<body>
<div class="cinema-intro" id="cinemaIntro" role="button" tabindex="0" aria-label="ورود به حلی سینما">
 <div class="intro-glow" aria-hidden="true"></div>
 <div class="intro-content">
  <img class="intro-logo" src="1.png" alt="">
  <h1 class="intro-title">حلی سینما</h1>
  <div class="intro-rule" aria-hidden="true"></div>
  <p class="intro-tagline">THE CINEMA EXPERIENCE</p>
 </div>
</div>
<div class="shell">
<main>
<section class="hero"><h1>حلی سینما</h1><p class="subtitle">سینما، ساده و بی‌حاشیه.</p></section>
<section aria-label="لیست پخش امروز"><div class="playlist-head"><h2>لیست پخش امروز</h2><span class="day">روز اول</span></div><div class="player-box inline-player"><div class="player-head"><h2 class="player-title">هاپرز</h2></div><div class="player-frame" id="inlinePlayer"></div></div><div class="grid" id="grid"></div></section>
</main>
<section class="ad-slot" aria-label="تبلیغ"><img src="t.gif" alt=""></section>
<footer id="secretTrigger" title="حلی سینما">حلی سینما<div class="version">CINEMA v1.2.12</div></footer>
</div>
<div class="secret-overlay" id="secretOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="secretTitle">
<section class="secret-room"><button class="secret-close" id="secretClose" type="button" aria-label="بستن">×</button><div class="secret-stamp" aria-hidden="true">✦</div><h2 id="secretTitle">اتاق مخفی سینما</h2><p>پیداش کردی! 👀<br>این بخش فقط برای کنجکاوهای واقعی حلی سینماست.<br>چراغ‌ها خاموش… فیلم به‌زودی شروع می‌شود.</p><div class="secret-code">SECRET SCREENING · 001</div></section>
</div>
<script>

const cinemaIntro=document.getElementById("cinemaIntro");
let introDismissed=false;
function dismissIntro(){
 if(introDismissed)return;
 introDismissed=true;
 cinemaIntro.classList.add("leaving");
 window.setTimeout(()=>{cinemaIntro.hidden=true;},850);
}
cinemaIntro.addEventListener("click",dismissIntro);
cinemaIntro.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();dismissIntro()}});
window.setTimeout(dismissIntro,4800);

const movies=[
 {title:"هاپرز",file:"1.jpg",embed:"https://www.aparat.com/video/video/embed/videohash/zbvl3ru/vt/frame"},
 {title:"داستان اسباب‌بازی ۵",file:"2.jpg"},
 {title:"سوپر ماریو: کهکشان",file:"3.jpg"}
];
const grid=document.getElementById("grid");
const inlinePlayer=document.getElementById("inlinePlayer");
const firstMovie=movies[0];
if(firstMovie && firstMovie.embed){
 const frame=document.createElement("iframe");
 frame.src=firstMovie.embed;
 frame.title="پخش "+firstMovie.title;
 frame.setAttribute("allow","autoplay; fullscreen; picture-in-picture; encrypted-media");
 frame.setAttribute("allowfullscreen","");
 frame.setAttribute("scrolling","no");
 frame.loading="eager";
 inlinePlayer.replaceChildren(frame);
}
for(const m of movies){
 const card=document.createElement("article");card.className="card";card.style.setProperty("--i",String(movies.indexOf(m)));
 const img=document.createElement("img");img.className="poster"+(m.embed?" playable":"");img.src=m.file;img.alt="پوستر "+m.title;img.loading="lazy";

 img.onerror=()=>{const f=document.createElement("div");f.className="fallback";f.textContent="پوستر "+m.title;img.replaceWith(f)};
 const title=document.createElement("h3");title.className="title";title.textContent=m.title;
 card.append(img,title);grid.append(card);
}
const trigger=document.getElementById("secretTrigger"),secretOverlay=document.getElementById("secretOverlay"),secretClose=document.getElementById("secretClose");
let taps=0,tapTimer;trigger.addEventListener("click",()=>{taps++;clearTimeout(tapTimer);if(taps>=5){taps=0;secretOverlay.hidden=false;secretClose.focus()}else tapTimer=setTimeout(()=>{taps=0},1800)});
function closeSecret(){secretOverlay.hidden=true;trigger.focus()}
secretClose.addEventListener("click",closeSecret);secretOverlay.addEventListener("click",e=>{if(e.target===secretOverlay)closeSecret()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!secretOverlay.hidden)closeSecret()});

/* Reveal content smoothly as the visitor scrolls */
const revealTargets=[...document.querySelectorAll('.card,.playlist-head,.ad-slot')];
revealTargets.forEach((el,index)=>{
 if(!el.classList.contains('card')) el.classList.add('scroll-reveal');
 el.style.transitionDelay=el.classList.contains('card')?'':Math.min(index*70,210)+'ms';
});
if('IntersectionObserver' in window){
 const revealObserver=new IntersectionObserver((entries,observer)=>{
  entries.forEach(entry=>{
   if(entry.isIntersecting){
    entry.target.classList.add('in-view');
    observer.unobserve(entry.target);
   }
  });
 },{threshold:0.12,rootMargin:'0px 0px -35px 0px'});
 revealTargets.forEach(el=>revealObserver.observe(el));
}else{
 revealTargets.forEach(el=>el.classList.add('in-view'));
}

</script>
</body>
</html>
