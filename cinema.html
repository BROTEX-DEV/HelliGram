<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="حلی سینما؛ برنامه‌های تصویری امروز">
  <title>حلی سینما</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#070b14;--line:#243249;--text:#f5f7fb;--muted:#9aa8bd}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#17325a 0,transparent 50%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}
    .shell{max-width:1120px;margin:auto;padding:0 22px}
    header{height:78px;display:flex;align-items:center;border-bottom:1px solid #ffffff12}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#3994ff,#1754c9);box-shadow:0 8px 25px #1768dc45;font-size:25px}
    .brand strong{display:block;font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
    .hero{text-align:center;padding:38px 0 26px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#a8ccff;background:#132644;border:1px solid #244b7d;border-radius:999px;padding:6px 12px;font-size:12px}
    .dot{width:7px;height:7px;background:#4e9aff;border-radius:50%;box-shadow:0 0 12px #4e9aff}h1{font-size:clamp(30px,5vw,48px);margin:14px 0 7px;font-weight:900;letter-spacing:-1px}
    .subtitle{color:var(--muted);margin:0;font-size:14px;line-height:1.9}
    .playlist-wrap{margin:0 0 30px}
    .playlist-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 19px;border:1px solid #2a4770;border-radius:16px;background:linear-gradient(120deg,#122743,#0c1728);color:var(--text);font:700 15px Vazirmatn,Tahoma,sans-serif;cursor:pointer;text-align:right}
    .playlist-toggle .left{display:flex;align-items:center;gap:11px}.playlist-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#1a3659;font-size:21px}.chevron{color:#9fc6ff;transition:transform .2s}.playlist-toggle[aria-expanded="true"] .chevron{transform:rotate(180deg)}
    .playlist-panel{margin-top:10px;padding:18px;border:1px solid #202e43;background:#0c1421;border-radius:16px}.playlist-panel[hidden]{display:none}
    .day-heading{font-size:17px;margin:0 0 14px}.movie-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .movie-card{min-width:0;overflow:hidden;border:1px solid #263750;background:#101b2b;border-radius:15px}
    .poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#0b1220}
    .poster-fallback{aspect-ratio:2/3;display:grid;place-items:center;text-align:center;padding:16px;color:#8ea5c4;background:linear-gradient(145deg,#162b48,#0a101c);font-size:14px}
    .movie-info{padding:12px}.movie-title{font-size:14px;font-weight:800;line-height:1.8;margin:0 0 10px}
    .watch{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:9px 10px;border-radius:10px;background:#1b5bc2;color:white;font-size:12px;font-weight:700;text-decoration:none}
    .watch:hover{background:#2875e7}
    .empty-note{color:var(--muted);font-size:12px;line-height:2;margin:15px 0 0}
    footer{border-top:1px solid #ffffff12;padding:17px 0 22px;text-align:center;color:#74849b;font-size:11px}footer .version{font-size:9px;color:#52627a;margin-top:5px;letter-spacing:.4px}
    @media(max-width:650px){.shell{padding:0 13px}header{height:68px}.brand strong{font-size:16px}.logo{width:40px;height:40px}.hero{padding:30px 0 20px}.movie-grid{gap:9px}.movie-info{padding:9px}.movie-title{font-size:12px}.watch{font-size:11px;padding:8px 4px}.playlist-panel{padding:12px}.poster-fallback{font-size:12px}}
    @media(max-width:380px){.movie-grid{grid-template-columns:1fr}.movie-card{display:grid;grid-template-columns:110px minmax(0,1fr)}.poster,.poster-fallback{aspect-ratio:2/3}.movie-info{align-self:center}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand" aria-label="حلی سینما"><span class="logo" aria-hidden="true">▶</span><span><strong>حلی سینما</strong><small>شبکه تصویری</small></span></div></header>
    <main>
      <section class="hero">
        <div class="eyebrow"><span class="dot"></span> برنامه‌های روزانه</div>
        <h1>حلی سینما</h1>
        <p class="subtitle">هر روز سه انیمیشن؛ پوستر را ببین و برای تماشا وارد صفحه ویدیو شو.</p>
      </section>
      <section class="playlist-wrap" aria-label="لیست پخش امروز">
        <button class="playlist-toggle" id="playlistToggle" type="button" aria-expanded="true" aria-controls="playlistPanel">
          <span class="left"><span class="playlist-icon" aria-hidden="true">☷</span><span>لیست پخش امروز</span></span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="playlist-panel" id="playlistPanel">
          <h2 class="day-heading" id="dayHeading">🎬 برنامه روز اول</h2>
          <div class="movie-grid" id="movieGrid"></div>
          <p class="empty-note">پوسترها باید کنار فایل cinema.html در ریشه مخزن و با نام‌های 1.jpg، 2.jpg و 3.jpg قرار داشته باشند.</p>
        </div>
      </section>
    </main>
    <footer>حلی سینما<div class="version">CINEMA v1.0.6</div></footer>
  </div>
  <script>
    const movies = [
      {title:"هاپرز", file:"1.jpg", url:"https://www.aparat.com/v/zbvl3ru"},
      {title:"داستان اسباب‌بازی ۵", file:"2.jpg", url:"https://www.aparat.com/v/irlbr9s"},
      {title:"سوپر ماریو: کهکشان", file:"3.jpg", url:"https://www.aparat.com/v/feci4e2"}
    ];
    const grid = document.getElementById("movieGrid");
    for (const movie of movies) {
      const card = document.createElement("article");
      card.className = "movie-card";
      const img = document.createElement("img");
      img.className = "poster";
      img.src = movie.file;
      img.alt = "پوستر " + movie.title;
      img.loading = "lazy";
      img.onerror = () => {
        const fallback = document.createElement("div");
        fallback.className = "poster-fallback";
        fallback.textContent = "پوستر " + movie.title;
        img.replaceWith(fallback);
      };
      const info = document.createElement("div");
      info.className = "movie-info";
      const title = document.createElement("h3");
      title.className = "movie-title";
      title.textContent = movie.title;
      const link = document.createElement("a");
      link.className = "watch";
      link.href = movie.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "تماشای ویدیو";
      info.append(title, link);
      card.append(img, info);
      grid.append(card);
    }
    const toggle = document.getElementById("playlistToggle");
    const panel = document.getElementById("playlistPanel");
    toggle.addEventListener("click", () => {
      const expanded = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!expanded));
      panel.hidden = expanded;
    });
  </script>
</body>
</html>
