<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>حلی سینما</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#17325a,transparent 50%),#070b14;color:#f5f7fb;font-family:Vazirmatn,Tahoma,sans-serif}.shell{max-width:1100px;margin:auto;padding:0 18px}header{padding:20px 0;border-bottom:1px solid #ffffff18;font-weight:900}.hero{text-align:center;padding:38px 0 26px}.hero h1{font-size:clamp(30px,5vw,48px);margin:12px 0}.hero p{color:#9aa8bd}.toggle{width:100%;padding:17px;border:1px solid #2a4770;border-radius:16px;background:#10213a;color:white;text-align:right;font:700 16px Vazirmatn;cursor:pointer}.panel{margin-top:10px;padding:16px;border:1px solid #202e43;background:#0c1421;border-radius:16px}.panel[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{overflow:hidden;border:1px solid #263750;background:#101b2b;border-radius:15px}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#0b1220}.fallback{aspect-ratio:2/3;display:grid;place-items:center;padding:12px;text-align:center;color:#8ea5c4;background:#13233a}.info{padding:12px}.title{margin:0;font-size:15px;line-height:1.8}footer{text-align:center;color:#74849b;border-top:1px solid #ffffff18;margin-top:28px;padding:18px;font-size:11px}.version{font-size:9px;color:#52627a;margin-top:5px}@media(max-width:650px){.shell{padding:0 12px}.grid{gap:8px}.info{padding:8px}.title{font-size:12px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:110px 1fr}.poster,.fallback{aspect-ratio:2/3}.info{align-self:center}}</style></head><body><div class="shell"><header>▶ حلی سینما</header><main><section class="hero"><h1>حلی سینما</h1><p>هر روز سه انیمیشن؛ پوسترها و عنوان فیلم‌ها</p></section><section><button class="toggle" id="toggle" aria-expanded="true" aria-controls="panel">☷　لیست پخش امروز　⌄</button><div class="panel" id="panel"><h2>🎬 برنامه روز اول</h2><div class="grid" id="grid"></div><p style="color:#9aa8bd;font-size:12px">پوسترها از فایل‌های تصویری کنار cinema.html بارگذاری می‌شوند.</p></div></section></main><footer>حلی سینما<div class="version">CINEMA v1.0.7</div></footer></div><script>const movies=[{title:"هاپرز",file:"1.jpg"},{title:"داستان اسباب‌بازی ۵",file:"2.jpg"},{title:"سوپر ماریو: کهکشان",file:"3.jpg"}];const grid=document.getElementById("grid");for(const m of movies){const card=document.createElement("article");card.className="card";const img=document.createElement("img");img.className="poster";img.src=m.file;img.alt="پوستر "+m.title;img.loading="lazy";img.onerror=()=>{const f=document.createElement("div");f.className="fallback";f.textContent="پوستر "+m.title;img.replaceWith(f)};const info=document.createElement("div");info.className="info";const title=document.createElement("h3");title.className="title";title.textContent=m.title;info.append(title);card.append(img,info);grid.append(card)}document.getElementById("toggle").addEventListener("click",e=>{const b=e.currentTarget;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));document.getElementById("panel").hidden=open});</script></body></html>
